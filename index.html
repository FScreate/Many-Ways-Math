V.game=()=>{const g=S.gm,meta=gmeta(g.id);let body;
  if(g.over)body=`<div class="card" style="text-align:center"><h2>${g.over.win?'You won!':'Good try!'}</h2><p style="margin:8px 0 14px;font-size:1.15rem">${g.over.text}</p><div class="row" style="justify-content:center"><button class="btn go" data-act="game" data-id="${g.id}">Play again</button><button class="btn" data-act="go" data-s="games">All games</button></div></div>`;
  else if(g.id=='pop')body=`<div class="prog"><span>Round ${g.round+1} of 10</span><span>Lives: ${'♥'.repeat(g.lives)}${'♡'.repeat(3-g.lives)}</span></div><div class="card">${qHTML(g.p)}</div><div class="sky">${g.ch.map(c=>`<button class="bal" data-act="pop" data-v="${c}"${g.wrong.includes(c)?' disabled':''}>${c}</button>`).join('')}</div>`;
  else if(g.id=='mem')body=`<div class="prog"><span>Moves: ${g.moves}</span><span>Pairs found: ${g.cards.filter(c=>c.done).length/2} of 6</span></div><div class="mem">${g.cards.map((c,i)=>`<button class="mc${c.done?' done':c.open?' open':''}" data-act="flip" data-i="${i}" aria-label="${c.open||c.done?esc(c.t):'Face-down card'}">${c.open||c.done?fx(c.t):'?'}</button>`).join('')}</div>`;
  else if(g.id=='frog'){const c=g.cfg,pc=v=>(v-c.min)/(c.max-c.min)*100;
    body=`<div class="prog"><span>Hop ${g.round+1} of 8</span><span>On target: ${g.hits}</span></div><div class="card"><div class="qt">Tap the line where <b>${fx(g.label)}</b> belongs.</div>
    <div class="track" data-act="frogtap" id="track">${c.ticks.map(t=>`<span class="tk${t.l==null?' mn':''}" style="left:${pc(t.v)}%">${t.l!=null?`<b>${t.l}</b>`:''}</span>`).join('')}${g.guess!=null?`<span class="mk" style="left:${pc(g.guess)}%">🐸</span><span class="mk flag" style="left:${pc(g.target)}%">📍</span>`:''}</div>
    ${g.guess!=null?`<div class="fdb ${g.hit?'good':'bad'}" role="status">${g.hit?'Right on the lily pad!':'Close. The pin shows where it belongs.'}</div><button class="btn go" data-act="frognext">Next hop</button>`:''}</div>`}
  else if(g.id=='color')body=`<div class="prog"><span>Picture: ${CBN_PICS[g.pi].name}</span><span>${g.fill.filter(Boolean).length} of ${CBN_PICS[g.pi].r.length} parts colored</span></div><div class="card" style="padding:12px">${cbnHTML(g)}</div><p style="text-align:center;font-weight:700">${g.sel?`Crayon ${g.sel} is ready. Tap every part with a ${g.sel}.`:'Tap a crayon first.'}</p>${cbnPalette(g)}`;
  else if(g.id=='tf')body=`<div class="prog"><span>Round ${g.round+1} of 12</span><span>Score: ${g.score}</span></div><div class="card"><span class="pill">True or false?</span><div class="qt" style="margin-top:8px">${g.e.t} = ${g.shown}</div>${g.last?`<p class="muted" style="margin-bottom:8px">${g.last}</p>`:''}<div class="choices"><button class="btn choice mint" data-act="tf" data-v="1">True</button><button class="btn choice berry" data-act="tf" data-v="0">False</button></div></div>`;
  else if(g.id=='sort')body=`<div class="prog"><span>Round ${g.round+1} of 5</span><span>Slips: ${g.slips}</span></div><div class="card"><div class="qt long">Tap the numbers in order, from smallest to biggest.</div><div class="tiles">${g.cards.map((c,i)=>`<button class="tile${g.done.includes(i)?' dn':''}" data-act="sortc" data-i="${i}"${g.done.includes(i)?' disabled':''}>${fx(c.s)}${g.done.includes(i)?'<small>'+(g.done.indexOf(i)+1)+'</small>':''}</button>`).join('')}</div></div>`;
  else if(g.id=='stones')body=`<div class="prog"><span>Row ${g.at+1} of 5</span><span>Lives: ${'♥'.repeat(g.lives)}${'♡'.repeat(3-g.lives)}</span></div><div class="card"><div class="qt">${g.rows[g.at].e.t} = ?</div></div><div class="card" style="background:#BFE0FF;display:flex;flex-direction:column;gap:8px"><div style="text-align:center;font-weight:700">🏁 Far bank</div>${[4,3,2,1,0].map(ri=>{const rw=g.rows[ri];return `<div class="tiles">${rw.opts.map(o=>{const sk=g.sunk.includes(ri+':'+o);return `<button class="tile${ri<g.at&&o==rw.e.v?' dn':''}${sk?' off':''}" data-act="stone" data-v="${o}"${ri!=g.at||sk?' disabled':''}>${ri<g.at?(o==rw.e.v?K().av:''):ri==g.at?(sk?'💦':o):'?'}</button>`}).join('')}</div>`}).join('')}<div style="text-align:center;font-weight:700">${g.at==0?K().av+' ':''}Start</div></div>`;
  else if(g.id=='bingo')body=`<div class="prog"><span>Strikes: ${g.strikes} of 3</span><span>Get 3 in a row</span></div><div class="card"><span class="pill">Find the answer on your card</span><div class="qt" style="margin-top:8px">${g.calls[g.ci].t} = ?</div></div><div class="tiles">${g.cells.map((v,i)=>`<button class="tile${g.marked.includes(i)?' dn':''}" data-act="bingo" data-i="${i}"${g.marked.includes(i)?' disabled':''}>${g.marked.includes(i)?'★':v}</button>`).join('')}</div>`;
  else if(g.id=='mole')body=`<div class="prog"><span>Time left: ${Math.max(0,Math.ceil((g.end-Date.now())/1000))}s</span><span>Whacked: ${g.score} of 8</span></div><div class="card"><div class="qt">${g.e.t} = ?</div></div><div class="tiles">${g.holes.map((v,i)=>`<button class="tile hole${v!=null?' up':''}" data-act="mole" data-i="${i}" aria-label="${v!=null?'Mole holding '+v:'Empty hole'}">${v!=null?'🐹<br>'+v:'🕳️'}</button>`).join('')}</div>`;
  else if(g.id=='sign')body=`<div class="prog"><span>Round ${g.round+1} of 10</span><span>Score: ${g.score}</span></div><div class="card"><span class="pill">Which sign is missing?</span><div class="qt" style="margin-top:8px">${g.a} ◯ ${g.b} = ${g.c}</div>${g.last?`<p class="muted" style="margin-bottom:8px">${g.last}</p>`:''}<div class="choices">${g.ops.map(o=>`<button class="btn choice" data-act="sign" data-v="${o}">${o}</button>`).join('')}</div></div>`;
  else if(g.id=='train')body=`<div class="prog"><span>Train ${g.round+1} of 8</span><span>Score: ${g.score}</span></div><div class="card"><span class="pill">Find the missing number</span><div class="train">🚂${g.seq.map((v,i)=>`<span class="car${i==g.bi?' q':''}">${i==g.bi?'?':fmt(v)}</span>`).join('')}</div>${g.last?`<p class="muted" style="margin-bottom:8px">${g.last}</p>`:''}<div class="choices">${g.ch.map(c=>`<button class="btn choice" data-act="train" data-v="${c}">${c}</button>`).join('')}</div></div>`;
  else if(g.id=='clash')body=`<div class="prog"><span>Round ${g.round+1} of 10</span><span>Score: ${g.score}</span></div><div class="card"><span class="pill">Tap the one that is worth more</span>${g.last?`<p class="muted" style="margin:8px 0">${g.last}</p>`:''}<div class="choices" style="margin-top:10px"><button class="btn choice" data-act="clash" data-v="L">${g.L.t}</button><button class="btn choice" data-act="clash" data-v="R">${g.R.t}</button></div></div>`;
  else if(g.id=='ttt')body=`<div class="card">${g.ask!=null?`<span class="pill">Answer to claim the square</span><div class="qt" style="margin-top:8px">${g.e.t} = ?</div><div class="choices">${g.ch.map(c=>`<button class="btn choice" data-act="tttans" data-v="${c}">${c}</button>`).join('')}</div>`:`<p style="font-weight:700">${g.msg||'Tap an empty square, then answer the problem to claim it. Get 3 in a row to beat the alien!'}</p>`}</div><div class="tiles">${g.b.map((c,i)=>`<button class="tile${c?' dn':''}${i===g.ask?' on':''}" data-act="tttcell" data-i="${i}"${c||g.ask!=null?' disabled':''} aria-label="Square ${i+1}${c?(c=='X'?', yours':', alien'):''}">${c=='X'?K().av:c=='O'?'👾':''}</button>`).join('')}</div>`;
  else if(g.id=='space')body=`<div class="prog"><span id="shud">${spaceHud(g)}</span></div><div class="field" id="field"><div class="ground"></div></div><div class="row" style="flex-wrap:nowrap"><div class="ansbox" id="ansbox" style="flex:1;min-height:52px"><span class="ph">?</span></div><button class="key" data-act="key" data-k="⌫" aria-label="Erase" style="width:56px">⌫</button><button class="btn go" data-act="ans" data-v="@">Zap!</button></div><div class="pad p5">${'1234567890'.split('').map(k=>`<button class="key" data-act="key" data-k="${k}">${k}</button>`).join('')}</div><p class="muted">Type the answer to any ship, then tap Zap. Do not let 3 ships land.</p>`;
  else if(g.id=='race')body=`<div class="card" style="padding:12px 14px"><div class="lane"><span class="rk" style="left:${Math.min(100,g.me)*.8}%">${K().av}🚀</span></div><div class="lane"><span class="rk" id="zog" style="left:${Math.min(100,g.zog)*.8}%">👾🛸</span></div><div class="row sp muted"><span>Earth</span><span>Moon 🌙</span></div></div><div class="card">${qHTML(g.p)}<div class="choices">${g.ch.map(c=>`<button class="btn choice" data-act="race" data-v="${c}">${c}</button>`).join('')}</div></div><p class="muted">Each right answer is a rocket boost. A miss gives Zog a boost.</p>`;
  else{const sum=g.on.reduce((a,i)=>a+g.tiles[i],0);body=`<div class="prog"><span>Round ${g.round+1} of 6</span><span>Solved: ${g.solved}</span></div><div class="card"><div class="qt">Make <b>${fmt(g.target)}</b></div><p class="muted" style="margin-bottom:10px">Tap tiles that add up to the target. Your total: <b>${fmt(sum)}</b></p><div class="tiles">${g.tiles.map((t,i)=>`<button class="tile${g.on.includes(i)?' on':''}" data-act="tile" data-i="${i}" aria-pressed="${g.on.includes(i)}">${fmt(t)}</button>`).join('')}</div>${g.msg?`<div class="fdb good" role="status">${g.msg}</div>`:''}</div><div class="row"><button class="btn ghost" data-act="mkskip">Skip this one</button></div>`}
  return bar(meta.name,'games')+`<main class="wrap">${body}</main>`};
V.grown=()=>bar('For grown-ups','who')+`<main class="wrap"><details class="card"><summary style="cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center">Use it offline and from the home screen</summary><p style="margin-top:8px">Add Many Ways Math to your home screen so it opens like an app. On iPhone or iPad, open it in Safari, tap Share, then Add to Home Screen. On Android, open it in Chrome, tap the menu, then Install app.</p><p style="margin-top:8px">After it has opened once with internet, it works with no internet. Progress is saved on the device and goes to your family account when you are back online. ${navigator.onLine?'':'<b>You are offline right now.</b>'}</p></details>${store.mode=='cloud'?'<div class="card row sp"><span>Family account password</span><button class="btn sm" data-act="go" data-s="setpw">Set or change password</button></div>':''}<p class="muted" style="max-width:60ch">A test is passed at 8 out of 10. Retakes always use new questions. Missed problems go to each child's Fix-It Notebook.</p>${S.kids.map(k=>{const rows=TL.filter(t=>k.t[t.id]);return `<div class="card" style="display:flex;flex-direction:column;gap:12px"><div class="row sp"><h2>${k.av} ${esc(k.name)}</h2><span class="muted">${k.age?'Age '+k.age+' · ':''}${k.sg?'Grade '+k.sg:'Kindergarten'} · ★ ${k.stars} · ${k.days} day${k.days==1?'':'s'} played · ${Object.values(k.badges).reduce((a,b)=>a+b,0)} badge levels</span></div>
  ${rows.length?`<div class="tw"><table class="gt"><tr><th>Topic</th><th>Grade</th><th>Lesson</th><th>Practice</th><th>Best test</th></tr>${rows.map(t=>{const s=k.t[t.id];return `<tr><td>${t.name}</td><td>${t.g}</td><td>${s.lesson?'Done':'—'}</td><td>${s.n?`${pct(s.c,s.n)}% of ${s.n}`:'—'}</td><td>${s.best!=null?s.best+'/10':'—'}</td></tr>`}).join('')}</table></div>`:'<p class="muted">No work yet.</p>'}
  ${k.tests.length?`<p class="muted">Recent tests: ${k.tests.slice(0,5).map(e=>`${esc(tname(e))} ${e.kind=='timed'?e.score+' in 90s':e.score+'/'+e.total} (${fdate(e.ts)})`).join(' · ')}</p>`:''}
  <p class="muted">Lesson path: set ${k.path.set+1} (${setInfo(k).name}), lesson ${Math.min(k.path.lesson+1,20)} of 20 · ${k.path.done} set${k.path.done==1?'':'s'} finished · ${k.c.dl} daily and ${k.c.weeks} weekly lessons done · ${unl(k)} of 15 games unlocked</p>
  ${Object.keys(k.easy||{}).filter(id=>T[id]).length?`<p><b>Just-right lessons:</b> extra help is on for ${Object.keys(k.easy).filter(id=>T[id]).map(id=>esc(T[id].name)).join(', ')}. It turns off once ${esc(k.name)} does well on that lesson.</p>`:''}${ccReport(k)}
  <p class="muted">Workbooks: ${[0,1,2,3,4,5].map(g=>`${g?'Grade '+g:'K'} ${(k.wb&&k.wb[g]?k.wb[g].done:0)}/${wbCount(g)}`).join(' · ')}</p>
  <div class="row"><span>Age:</span><button class="btn sm" data-act="ga" data-id="${k.id}" data-v="-1" aria-label="Lower age">−</button><b>${k.age||'not set'}</b><button class="btn sm" data-act="ga" data-id="${k.id}" data-v="1" aria-label="Raise age">+</button></div>
  <div class="row"><span>School grade:</span><button class="btn sm" data-act="gg" data-id="${k.id}" data-v="-1" aria-label="Lower grade">−</button><b>${k.sg}</b><button class="btn sm" data-act="gg" data-id="${k.id}" data-v="1" aria-label="Raise grade">+</button><span class="muted">Changing the grade restarts the current lesson set at that grade.</span></div>
  <div class="row">${k.code?`<button class="btn sm" data-act="rmcode" data-id="${k.id}">Remove picture code</button>`:''}
  ${S.delq==k.id?`<span>Delete ${esc(k.name)} and all progress?</span><button class="btn sm berry" data-act="delyes" data-id="${k.id}">Yes, delete</button><button class="btn sm" data-act="delno">Keep</button>`:`<button class="btn sm ghost" data-act="del" data-id="${k.id}">Delete profile</button>`}</div></div>`}).join('')}</main>`;

function setGuide(k,then){const si=setInfo(k),wv=w=>`<span class="pill ${w.tag.split(' ')[0]}">${w.tag}</span><h3 style="margin-top:6px">${w.name}</h3><div class="vis">${w.vis}</div><ol>${w.steps.map(s=>`<li>${fx(s)}</li>`).join('')}</ol>`,qb=p=>`<div class="qt${p.q.length>44?' long':''}">${fx(p.q)}</div>${p.vis||''}`;
  const units=setUnits(si);
  const st=[{say:`${k.name}, you are starting a new set of ${si.tids.length} lessons: ${si.name}. Each lesson teaches one new step. Let me show you the first one.`,body:`<p><b>In this set:</b></p><ul>${units.map(u=>`<li><b>${u}</b></li>`).join('')}</ul>`}];
  si.tids.slice(0,1).forEach(tid=>{const t=T[tid],ex=freshP(tid),ws=t.ways(ex);st.push({say:`${t.name}. ${t.intro}`,body:qb(ex)+wv(ws[0])});
    if(ws[1])st.push({say:`Here is another way to solve the same problem. It is called "${ws[1].name}". Both ways give ${SIGN[ex.a]||ex.a}.`,body:qb(ex)+wv(ws[1])});
    let p2;for(let i=0;i<6;i++){p2=freshP(tid,ex.q);if(p2.type=='num')break}if(p2.type=='num')st.push({say:'Your turn. Try this one. If you miss, I will show you a way.',q:p2.q,vis:p2.vis,a:+p2.a,p:p2,help:t.ways(p2)[0]})});
  st.push({say:`Every lesson starts by teaching its new step, just like this. There are 20 lessons, with a review lesson after every few, then a set test. ${nextGame(k)?'Pass it and a new game unlocks: '+nextGame(k).name+'!':'Pass it to finish the set!'} Your first lesson is ready.`});
  go('guide',{gd:{i:0,steps:st,kind:'set',then}})}
V.path=()=>{const k=K(),P=k.path,si=setInfo(k),ng=nextGame(k),wkd=P.week.w==wk()&&P.week.done;return bar('My Lessons','home')+`<main class="wrap"><div class="card" style="display:flex;flex-direction:column;gap:10px"><span><span class="pill">Set ${P.set+1}</span></span><h2>${si.name}</h2><p>You are learning: ${setUnits(si).join(', ')}.</p><div class="pb"><i style="width:${Math.max(3,P.lesson/20*100)}%"></i></div><p><b>${Math.min(P.lesson,20)} of 20 lessons done.</b> ${ng?`Finish all 20 and pass the set test to unlock a new game: <b>${ng.name}</b>.`:'Every game is already unlocked.'}</p>
  <div class="row">${P.lesson>=20?'<button class="btn go" data-act="settest">Take the set test</button>':`<button class="btn go" data-act="dlstart" data-i="${P.lesson}">Start lesson ${P.lesson+1}: ${lname(si.plan[P.lesson])}</button>`}<button class="btn" data-act="setguide">Watch the guided lesson for this set</button></div></div>
  <div class="card"><h3>The 20 lessons</h3><p class="muted">Tap a finished lesson to do it again with new problems.</p><div class="pgs">${si.plan.map((pl,i)=>`<button class="btn sm${i<P.lesson?' dn':''}" data-act="dlstart" data-i="${i}"${i>P.lesson?' disabled':''} aria-label="Lesson ${i+1}, ${lname(pl)}${i>P.lesson?', locked':''}">${i<P.lesson?'✓ ':''}${i+1}</button>`).join('')}<button class="btn sm${P.lesson>=20?' go':''}" data-act="settest"${P.lesson>=20?'':' disabled'}>Set test</button></div></div>
  <div class="card hi2" style="box-shadow:5px 5px 0 var(--ink);border-width:3px"><div><h3>Weekly lesson</h3><span class="muted">${wkd?`Done this week. ${P.week.score} of 10 right.`:'A bigger review of the math from this week. 10 problems.'}</span></div><button class="btn ${wkd?'':'grape'}" data-act="wkstart">${wkd?'Do it again':'Start'}</button></div>
  <p class="muted">${k.path.done} set${k.path.done==1?'':'s'} finished so far. Each new set is a step harder.</p></main>`};
V.dl=()=>{const s=S.dl,k=K(),n=s.probs.length,title=s.kind=='weekly'?'Weekly lesson':`Lesson ${s.idx+1} of 20`;
  if(s.stage=='teach'){const t=T[s.tid];return bar(title,'path')+`<main class="wrap"><div class="card"><span class="pill">New idea</span>${t.cc?`<span class="cctag">Common Core ${t.cc}</span>`:''}<h2 style="margin-top:6px">${t.name}</h2><p style="font-size:1.2rem;margin-top:8px;max-width:50ch">${t.intro}</p></div>${s.easy?`<div class="adapt">Extra help is on for this lesson: one more look at the ways, ${prevTid(s.tid)?'two easier warm-up problems, ':''}and the ways open on your first problems.</div>`:''}<div class="card"><span class="pill">Example</span>${qHTML(s.ex)}<p class="muted">The answer is <b>${fx(SIGN[s.ex.a]||s.ex.a)}</b>. Tap the tabs to see different ways to get it.</p></div>${waysHTML(s.ex,'Tap a way to see it')}<div><button class="btn go" data-act="dlgo">Start the ${n} problems</button></div></main>`}
  if(s.stage=='done'){const pass=s.right>=s.need,P=k.path;return bar(title,'path')+`<main class="wrap"><div class="card" style="text-align:center"><h2>${pass?(s.kind=='weekly'?'Weekly lesson complete!':'Lesson complete!'):'So close!'}</h2><div class="score">${s.right}<span style="font-size:.45em"> out of ${n}</span></div><p style="font-size:1.15rem;margin:8px 0 14px">${pass?(s.kind=='weekly'?'You earned 10 stars.':'You earned 3 stars.')+(s.kind=='lesson'&&P.lesson>=20?' That was lesson 20. The set test is unlocked!':''):`You need ${s.need} right to finish this lesson. Try it again with new problems.`}</p>
    ${s.adapt=='easy'?`<div class="adapt">${pass?'That one was tricky.':'This one is tricky, and that is OK.'} ${pass?'Next time you do this lesson':'When you try again'}, it starts with extra help${prevTid(s.tid)?' and easier warm-ups':''}.</div>`:s.adapt=='better'?'<div class="adapt">Much better! You did not need the extra help this time.</div>':''}
    ${pass&&s.kind=='lesson'&&canSkip(k)?`<div class="adapt"><b>You are zooming!</b> Two lessons in a row with every problem right the first time. You can skip lesson ${P.lesson+1} (${esc(lname(canSkip(k)))}) and jump ahead.<div class="row" style="margin-top:8px"><button class="btn grape" data-act="dlskip">Skip ahead</button></div></div>`:''}
    <div class="row" style="justify-content:center">${!pass?`<button class="btn go" data-act="dlstart" data-i="${s.idx}">Try this lesson again</button>`:s.kind=='weekly'?'':P.lesson>=20?'<button class="btn go" data-act="settest">Take the set test</button>':`<button class="btn go" data-act="dlstart" data-i="${P.lesson}">Next lesson</button>`}<button class="btn" data-act="go" data-s="path">My lessons</button><button class="btn" data-act="go" data-s="home">Home</button></div></div></main>`}
  const p=s.probs[s.i];return bar(title,'path')+`<main class="wrap"><div class="prog"><span>Problem ${s.i+1} of ${n}</span><div class="pb"><i style="width:${s.i/n*100}%"></i></div></div><div class="card"><span class="pill">${T[p.tid].name}</span>${T[p.tid].cc?`<span class="cctag">${T[p.tid].cc}</span>`:''}${qHTML(p)}
  ${s.pd?`<div class="fdb ${s.ok?'good':'bad'}" role="status">${s.msg}</div><button class="btn go" data-act="dlnext">${s.i>=n-1?'Finish the lesson':'Next problem'}</button>`:(s.msg?`<div class="fdb bad" role="status">${s.msg}</div>`:'')+entryHTML(p)}</div>
  ${s.pd&&s.ok?'':`<div class="row"><button class="btn ghost" data-act="dlhint" style="background:#fff">${s.hint?'Hide the ways':'Show me a way'}</button></div>`}${(s.hint&&!(s.pd&&s.ok))||(s.pd&&!s.ok)?waysHTML(p):''}</main>`};
function dlAnswer(v){const s=S.dl,p=s.probs[s.i],k=K();if(s.pd)return;touchDay(k);const ok=isRight(p,v);
  if(ok){if(!s.tries){rec(k,p,true);s.first=(s.first||0)+1}else k.stars++;s.right++;s.pd=s.ok=true;s.msg=CHEER[Math.floor(Math.random()*4)];snd('ok');confetti(28);digitSay(yay())}

function freshP(tid,not){let p;for(let i=0;i<5;i++){p=mk(tid,RNG(seed()));if(p.q!=not)break}return p}
function rec(k,p,ok){const s=tstat(k,p.tid);s.n++;if(ok){s.c++;k.c.correct++;k.stars++;k.run++;k.c.bestRun=Math.max(k.c.bestRun,k.run);if(p.word)k.c.words++}else k.run=0}
function miss(k,p){if(!k.missed.some(m=>m.q==p.q)){k.missed.unshift({tid:p.tid,q:p.q,a:p.a});k.missed.length=Math.min(k.missed.length,40)}}
const CHEER=['Yes! You got it.','Correct. Nice thinking.','That is right!','You solved it.'];
function practiceAnswer(v){const s=S.pr,p=s.p,k=K();if(s.done)return;touchDay(k);const ok=isRight(p,v);

    if(s.fix!=null){k.missed.splice(s.fix,1);k.c.fixed++}}
  else if(!s.tries){rec(k,p,false);s.tries=1;s.msg='Not yet. Try again, or tap "Show me a way" for help.'}
  else{s.done=true;s.ok=false;s.msg=`The answer is ${fx(SIGN[p.a]||p.a)}. Look at the ways below to see how.`;if(s.fix==null)miss(k,p)}
  S.entry='';save();render();if(ok){snd('ok');confetti(28);digitSay(yay())}else{snd('no');digitSay(s.done?`That one was tricky. The answer is ${p.a}. Let us look at a way to solve it together.`:'Not yet. Try again. You can do it!')}checkBadges()}
function pickSeed(cfg,old){let best=seed(),bo=1e9;if(!old)return best;const os=new Set(genTest({...cfg,seed:old.seed},10).map(p=>p.q));
  for(let i=0;i<8;i++){const sd=seed(),o=genTest({...cfg,seed:sd},10).filter(p=>os.has(p.q)).length;if(o<bo){bo=o;best=sd}if(!o)break}return best}
function startTest(tid,kind,old,pool,setIdx){const k=K(),g=T[tid]?T[tid].g:(old?old.g:k.g),cfg={tid,kind,g,retakeOf:old?old.id:null};if(pool||old&&old.pool){cfg.pool=pool||old.pool;cfg.set=setIdx!=null?setIdx:old.set}cfg.seed=pickSeed(cfg,old);
  const n=kind=='timed'?70:10;S.ts={cfg,n,probs:genTest(cfg,n),i:0,ans:[],t0:Date.now()};go('test');
  if(kind=='timed'){const end=Date.now()+90000;S.tick=setInterval(()=>{const left=Math.max(0,Math.ceil((end-Date.now())/1000)),c=$('clock');if(c)c.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(!left)finishTest()},250)}}
function testAnswer(v){const s=S.ts;snd('tap');s.ans.push(v);s.i++;S.entry='';if(s.i>=s.probs.length||(s.cfg.kind!='timed'&&s.i>=s.n))finishTest();else render()}

  s.ans.forEach((v,i)=>{rec(k,s.probs[i],!!ok[i]);if(!ok[i]&&m++<5)miss(k,s.probs[i])});
  const e={id:'t'+Date.now().toString(36),ts:Date.now(),kind:s.cfg.kind,tid:s.cfg.tid,g:s.cfg.g,seed:s.cfg.seed,ans:s.ans,ok,score,total:tm?s.ans.length:s.n,retakeOf:s.cfg.retakeOf};if(s.cfg.pool){e.pool=s.cfg.pool;e.set=s.cfg.set}
  let old=null;if(e.retakeOf){const o=k.tests.find(t=>t.id==e.retakeOf);if(o){old=o.score;if(score>o.score)k.c.comeback++}}
  if(tm)k.c.bestSprint=Math.max(k.c.bestSprint,score);else{if(score==10)k.c.perfect++;if(T[e.tid]){const st=tstat(k,e.tid);st.best=Math.max(st.best||0,score)}}

function gp(r){const k=K();for(let i=0;i<20;i++){const p=mk(pick(r,FAST[k.g]),r);if(p.type=='num')return p}return mk('add20',r)}
function frogCfg(g){const tk=(a,b,st,lab)=>{const o=[];for(let v=a;v<=b+1e-9;v+=st)o.push({v,l:lab(v)});return o};
  if(g==1)return{min:0,max:20,tol:.5,snap:1,ticks:tk(0,20,1,v=>v%5?null:v),t:r=>{const v=ri(r,1,19);return[v,String(v)]}};
  if(g==2)return{min:0,max:100,tol:3,ticks:tk(0,100,10,v=>v),t:r=>{const v=ri(r,3,97);return[v,String(v)]}};
  if(g==3)return{min:0,max:1000,tol:30,ticks:tk(0,1000,100,v=>v%200?null:v),t:r=>{const v=ri(r,3,97)*10;return[v,String(v)]}};
  if(g==4)return{min:0,max:1,tol:.06,ticks:[{v:0,l:'0'},{v:.5,l:'half'},{v:1,l:'1'}],t:r=>{const d=pick(r,[3,4,5,6,8,10]),n=ri(r,1,d-1);return[n/d,`${n}/${d}`]}};
  return{min:0,max:2,tol:.07,ticks:tk(0,2,.5,v=>fmt(v)),t:r=>{const v=ri(r,5,195)/100;return[v,fmt(v)]}}}
function frogRound(g){const[t,l]=g.cfg.t(g.r);g.target=t;g.label=l;g.guess=null}
function makeRound(g){const k=Math.min(K().g,5),r=g.r,u=[1,5,5,25,.25][k-1],lo=[1,1,2,1,1][k-1],hi=[9,8,30,20,20][k-1],set=new Set();while(set.size<6)set.add(ri(r,lo,hi)*u);g.tiles=shuf(r,[...set]);
  const ix=shuf(r,[0,1,2,3,4,5]).slice(0,ri(r,2,3));g.target=ix.reduce((a,i)=>a+g.tiles[i],0);g.on=[];g.msg=''}
function popRound(g){g.p=gp(g.r);g.ch=distract(g.r,g.p.a);g.wrong=[]}
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],G=()=>K().g;
const near=(r,v,n)=>{const s=new Set();let q=0;while(s.size<n&&q++<80){const x=v+pick(r,[1,-1,2,-2,3,10,-10,5,-5]);if(x>=0&&x!=v)s.add(x)}let j=11;while(s.size<n)s.add(v+j++);return[...s]};
function tfRound(g){g.e=expr(g.r,G());g.truth=g.r()<.5;g.shown=g.truth?g.e.v:near(g.r,g.e.v,1)[0]}
function sortRound(g){const r=g.r,gr=G(),set=new Map();let q=0;
  while(set.size<5&&q++<200){let s,v;if(gr<=3){v=ri(r,0,gr==1?20:gr==2?100:999);s=String(v)}else if(gr==4){const d=pick(r,[2,3,4,5,6,8]),n=ri(r,1,d-1);v=n/d;s=n+'/'+d}else if(gr==5){v=ri(r,1,999)/100;s=fmt(v)}else{v=ri(r,-20,20);s=String(v)}
    if(![...set.values()].some(c=>Math.abs(c.v-v)<1e-9))set.set(s,{s,v})}
  g.cards=[...set.values()];g.order=g.cards.map((c,i)=>i).sort((a,b)=>g.cards[a].v-g.cards[b].v);g.done=[]}
function signRound(g){const r=g.r,gr=G();g.ops=gr<=2?['+','−']:['+','−','×','÷'];for(let q=0;q<60;q++){const op=pick(r,g.ops);let a,b;const m=gr<=1?10:gr==2?50:99;
    if(op=='+'){a=ri(r,1,m);b=ri(r,1,m)}else if(op=='−'){a=ri(r,2,m);b=ri(r,1,a-1)}else if(op=='×'){a=ri(r,2,gr<=3?10:12);b=ri(r,2,10)}else{b=ri(r,2,10);a=b*ri(r,2,10)}
    const all={'+':a+b,'−':a-b,'×':a*b,'÷':a/b},c=all[op];if(Object.values(all).filter(x=>x==c).length==1){g.a=a;g.b=b;g.c=c;g.op=op;return}}}
function trainRound(g){const r=g.r,gr=G();let st,s0,mul=0;
  if(gr==1){st=pick(r,[1,2,5,10]);s0=st*ri(r,0,6)}else if(gr==2){st=pick(r,[2,3,4,5,10,-2,-5]);s0=st<0?ri(r,30,60):st*ri(r,1,9)}else if(gr==3){if(r()<.3){mul=2;s0=ri(r,1,6)}else{st=ri(r,3,12);s0=ri(r,0,30)}}
  else if(gr==4){st=pick(r,[25,50,11,15,20,100,-25]);s0=st<0?ri(r,8,12)*25:ri(r,0,9)*st}else if(gr==5){st=pick(r,[.5,.25,1.5,.1,.2]);s0=ri(r,0,8)}else{if(r()<.3){mul=3;s0=ri(r,1,4)}else{st=pick(r,[-3,-4,-5,-7,-6]);s0=ri(r,5,15)}}
  g.seq=[s0];for(let i=1;i<5;i++)g.seq.push(mul?g.seq[i-1]*mul:Math.round((g.seq[i-1]+st)*100)/100);g.bi=ri(r,2,4);const a=g.seq[g.bi],d=mul?g.seq[g.bi-1]:Math.abs(st),set=new Set([fmt(a)]);[a+d,a-d,a+2*d,a-2*d,a+1,a+10].forEach(x=>{if(set.size<4)set.add(fmt(x))});g.ch=shuf(r,[...set]);g.rule=mul?'times '+mul:(st>0?'add ':'subtract ')+fmt(Math.abs(st))}
function clashRound(g){let q=0;do{g.L=expr(g.r,G());g.R=expr(g.r,G())}while(g.L.v==g.R.v&&q++<40)}
function moleTick(g){const r=g.r,ix=shuf(r,[0,1,2,3,4,5,6,7,8]).slice(0,3),w=near(r,g.e.v,3);g.holes=Array(9).fill(null);ix.forEach((h,j)=>{g.holes[h]=w[j]});if(r()<.7)g.holes[ix[0]]=g.e.v}
function tttAI(g){const b=g.b,find=m=>{for(const L of LINES){const c=L.map(i=>b[i]);if(c.filter(x=>x==m).length==2&&c.includes(''))return L[c.indexOf('')]}return -1};let i=find('O');if(i<0)i=find('X');if(i<0&&!b[4])i=4;if(i<0){const e=b.map((c,j)=>c?-1:j).filter(j=>j>=0);i=e[Math.floor(g.r()*e.length)]}if(i>=0)b[i]='O'}
const won=(b,m)=>LINES.some(L=>L.every(i=>b[i]==m));
function startGame(id){const k0=K(),gi=GAMES.findIndex(x=>x.id==id);if(gi>=unl(k0)&&!k0.games[id]?.wins)return;if(id=='color'&&k0.sg!==0)return;const r=RNG(seed()),g={id,r};
  if(id=='color'){g.pi=((k0.games.color&&k0.games.color.wins)||0)%CBN_PICS.length;g.fill=[];g.sel=0}
  if(id=='pop'){g.round=0;g.lives=3;g.score=0;popRound(g)}
  if(id=='mem'){const ps=[],as=new Set();let n=0;while(ps.length<6&&n++<200){const p=gp(r);if(!as.has(p.a)&&!ps.some(x=>x.q==p.q)){as.add(p.a);ps.push(p)}}
    g.cards=shuf(r,ps.flatMap((p,i)=>[{t:p.q.replace(' = ?','').replace('What is the top number?','').replace('What is the missing top number?','').replace('How many in all?','').trim(),k:i},{t:p.a,k:i}]));g.moves=0;g.sel=[]}
  if(id=='frog'){g.cfg=frogCfg(K().g);g.round=0;g.hits=0;frogRound(g)}
  if(id=='make'){g.round=0;g.solved=0;makeRound(g)}

  ${st.done?`<div class="fdb good" role="status"><b>You solved it!</b> ${esc(st.fin)} Now ${p.type=='mc'?'tap that answer below':'type that answer below'}.</div>`:
  `<div class="qt long" style="margin-top:8px">${esc(s.q)}</div>${ps.err?`<div class="fdb bad" role="status">${ps.err}</div>`:''}${s.auto?'<button class="btn go" data-act="psnext">Got it</button>':
  `<div class="entry"><div class="ansbox" id="psbox" aria-live="polite">${ps.e?esc(ps.e):'<span class="ph">?</span>'}</div><div class="pad">${['1','2','3','4','5','6','7','8','9','0','⌫'].map(k=>`<button class="key" data-act="pskey" data-k="${k}"${k=='⌫'?' aria-label="Erase"':''}${k=='0'?' style="grid-column:2"':''}>${k}</button>`).join('')}</div><button class="btn go" data-act="pscheck">Check this step</button></div>${S.scr=='test'?'':'<div class="row" style="justify-content:center;margin-top:8px"><button class="btn ghost sm" data-act="psshow" style="background:#fff">Show me this step</button></div>'}`}`}
  </div>`}
const psStep=(ps,shown)=>{const st=ps.st,s=st.steps[st.i];s.fx&&s.fx();st.note=shown?`The answer is ${s.a}. ${s.note||''}`:(s.note||'');st.i++;ps.e='';ps.err='';if(st.i>=st.steps.length){st.done=1;snd('ok');confetti(20)}else snd('tap');render()};
Object.assign(A,{
  psopen:()=>{const p=S.psp,sp=stackable(p);if(!sp)return;S.ps={q:p.q,st:newStack(sp.op,sp.lvl,RNG(1),[sp.a,sp.b]),e:'',err:''};render();const el=document.querySelector('.pstack');if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'})},
  psclose:()=>{S.ps=null;render()},
  pskey:d=>{const ps=S.ps;if(!ps)return;ps.e=d.k=='⌫'?ps.e.slice(0,-1):ps.e.length<6?ps.e+d.k:ps.e;const b=$('psbox');if(b)b.innerHTML=ps.e?esc(ps.e):'<span class="ph">?</span>'},
  pscheck:()=>{const ps=S.ps;if(!ps||ps.st.done)return;const s=ps.st.steps[ps.st.i];if(ps.e===''){toast('Tap the numbers to type this step first.');return}if(+ps.e===s.a)psStep(ps,false);else{ps.err='Not quite. Try this step again.';ps.e='';snd('no');render()}},
  psnext:()=>{const ps=S.ps;if(ps&&!ps.st.done)psStep(ps,false)},
  psshow:()=>{const ps=S.ps;if(ps&&!ps.st.done)psStep(ps,true)}
});
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el||el.disabled)return;const f=A[el.dataset.act];if(f)f(el.dataset,el,ev)});
document.addEventListener('input',ev=>{if(ev.target.id=='nm'&&S.form)S.form.name=ev.target.value});
document.addEventListener('keydown',ev=>{if(ev.target.tagName=='INPUT'||$('over').classList.contains('on'))return;
  if(S.ps&&!S.ps.st.done&&document.getElementById('psbox')){if(/^[0-9]$/.test(ev.key))A.pskey({k:ev.key});else if(ev.key=='Backspace')A.pskey({k:'⌫'});else if(ev.key=='Enter'&&!ev.target.closest('button')){ev.preventDefault();A.pscheck()}return}
  const sk=S.scr=='stack'&&!S.sk.done&&!S.sk.steps[S.sk.i].auto,gq=S.scr=='guide'&&!S.gd.ok&&S.gd.steps[S.gd.i].q,sp=S.scr=='game'&&S.gm.id=='space'&&!S.gm.over,p=sk||gq||sp?{type:'num'}:S.scr=='dl'&&S.dl.stage=='work'&&!S.dl.pd?S.dl.probs[S.dl.i]:S.scr=='page'&&!S.st.done?S.st.p:S.scr=='practice'&&!S.pr.done?S.pr.p:S.scr=='test'?S.ts.probs[S.ts.i]:null;if(!p||p.type!='num')return;
  if(/^[0-9.]$/.test(ev.key))A.key({k:ev.key});else if(ev.key=='-'&&p.neg)A.key({k:'±'});else if(ev.key=='Backspace')A.key({k:'⌫'});else if(ev.key=='Enter'&&!ev.target.closest('button')){ev.preventDefault();A.ans({v:'@'})}});
render();
addEventListener('online',()=>store.resync());
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
store.init().then(res=>{if(res==='recover'){S.kids=[];go('setpw')}else if(res===null){S.kids=[];go('signin')}else{S.kids=res;go('who')}});
window.addEventListener('sbrecovery',()=>{if(S.scr!='setpw'){S.authErr='';go('setpw')}});
</script>
</body>
