<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Many Ways Math</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16224A">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Many Ways Math">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Grandstander:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* layout idea: a graph-paper math notebook; work sits on white cards inked with marker outlines and stuck down like stickers */
  --paper:#EAF2F9; --grid:#CFDFEE; --ink:#16224A; --card:#FFFFFF; --soft:#3D4870;
  --sun:#FFB81C; --sky:#2F7FE0; --mint:#14A06E; --berry:#E2445C; --grape:#7650D0;
  --display:"Grandstander","Comic Sans MS","Trebuchet MS",sans-serif;
  --body:"Atkinson Hyperlegible","Verdana","Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{min-height:100%}body{margin:0;min-height:100vh}
body{background:#BDE6FF;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--grape);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
h2{font-size:1.5rem} h3{font-size:1.15rem}
p{margin:0}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 56px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:18px}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--ink);color:#fff}
.bar h1{font-size:1.25rem;flex:1;min-width:0}
.back{background:var(--sun);color:var(--ink);border:0;border-radius:12px;width:44px;height:44px;font-size:1.4rem;font-weight:700;flex:none}
.stars{font-family:var(--display);background:#fff;color:var(--ink);border-radius:999px;padding:4px 12px;white-space:nowrap}
.btn{font-family:var(--display);font-size:1.1rem;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:10px 16px;box-shadow:3px 3px 0 var(--ink);min-height:48px}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.go{background:var(--sun)} .btn.sky{background:var(--sky);color:#fff} .btn.mint{background:var(--mint);color:#fff} .btn.grape{background:var(--grape);color:#fff} .btn.berry{background:var(--berry);color:#fff}
.btn.ghost{box-shadow:none;border-width:2px;font-size:1rem}
.btn.sm{min-height:44px;min-width:44px;padding:5px 12px;font-size:.95rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.muted{color:var(--soft);font-size:.95rem}
.pill{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;background:var(--paper)}
.pill.Picture{background:#FFE3A1}.pill.Number{background:#BFE0FF}.pill.Classic{background:#D9CCFA}.pill.New{background:#B9EFD8}.pill.Think{background:#FFC9D2}

/* playground background */
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(#9EDBFF 0%,#D4F0FF 55%,#FFF4C7 100%)}
#bg .sun{position:absolute;top:-70px;right:-70px;width:220px;height:220px;border-radius:50%;background:repeating-conic-gradient(#FFD34D 0 12deg,#FFE894 12deg 24deg);animation:spin 60s linear infinite}
#bg .sun::after{content:"";position:absolute;inset:44px;border-radius:50%;background:var(--sun);border:4px solid var(--ink)}
#bg .cloud{position:absolute;width:150px;height:46px;background:#fff;border-radius:999px;opacity:.9;animation:drift linear infinite}
#bg .cloud::before,#bg .cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
#bg .cloud::before{width:66px;height:66px;left:22px;top:-30px}#bg .cloud::after{width:50px;height:50px;left:76px;top:-20px}
#bg .fl{position:absolute;bottom:-70px;font-family:var(--display);font-weight:800;display:grid;place-items:center;border-radius:50%;border:3px solid #16224A55;color:#fff;animation:rise linear infinite;opacity:.55}
#bg svg{position:absolute;left:0;bottom:0;width:100%;height:30vh;min-height:150px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(calc(100vw + 200px))}}
@keyframes rise{from{transform:translateY(0) rotate(-20deg)}to{transform:translateY(-125vh) rotate(40deg)}}
.me .av{animation:hop 1.6s ease-in-out infinite;display:inline-block}
@keyframes hop{0%,60%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-10px) rotate(-8deg)}45%{transform:translateY(0) rotate(6deg)}}
.says{position:relative;background:#FFF4C7;border:2px solid var(--ink);border-radius:14px;padding:6px 12px;margin-top:8px;font-weight:700;max-width:38ch}
.door,.kid,.titem,.tile,.choice{transition:transform .15s}
@media (hover:hover){.door:hover,.kid:hover{transform:rotate(-1.5deg) scale(1.03)}.titem:hover,.choice:hover{transform:translateX(4px)}}
.qt{animation:slidein .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes slidein{from{transform:translateY(12px) scale(.96);opacity:.3}to{transform:none;opacity:1}}
.fdb.good{animation:pop2 .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop2{from{transform:scale(.7)}to{transform:scale(1)}}

/* profiles */
.hero{text-align:left}
.hero h1{font-size:clamp(2.2rem,9vw,3.6rem);letter-spacing:-.01em}
.hero h1 em{font-style:normal;background:var(--sun);padding:0 .15em;border-radius:10px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.kid{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;text-align:center}
.av{font-size:3rem;line-height:1.1}
.kid b{font-family:var(--display);font-size:1.2rem;overflow-wrap:anywhere}
.kid.add{border-style:dashed;box-shadow:none;background:transparent}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.buddybtn{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.bchg{font-family:var(--display);font-size:.8rem;border:2px solid var(--ink);border-radius:999px;padding:0 8px;background:var(--sun)}
.pick button{border:3px solid transparent;background:var(--paper);border-radius:12px;font-size:1.7rem;width:52px;height:52px}
.pick button.on{border-color:var(--ink);background:var(--sun)}
.pick.g button{font-family:var(--display);font-size:1.2rem}
input[type=text]{font:inherit;font-size:1.2rem;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;width:100%;background:#fff;color:var(--ink)}
label{font-weight:700;display:block;margin-bottom:6px}
.field{display:flex;flex-direction:column}

/* home */
.me{display:flex;gap:14px;align-items:center}
.me .av{font-size:3.4rem}
.me h2{font-size:1.7rem;overflow-wrap:anywhere}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.stat span{font-family:var(--display);border:2px solid var(--ink);border-radius:999px;padding:2px 12px;background:var(--paper)}
.doors{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.door{text-align:left;padding:16px;display:flex;flex-direction:column;gap:4px;min-height:118px;color:var(--ink)}
.door b{font-family:var(--display);font-size:1.45rem;line-height:1.05}
.door span{font-size:.95rem}
.door.a{background:#FFE08A}.door.b{background:#BFE0FF}.door.c{background:#B9EFD8}.door.d{background:#FFC9D2}.door.f{background:#FFD3AD}.door.g{background:#BDEFF2}.door.e{background:#D9CCFA;grid-column:1/-1;min-height:0}
.pb{height:14px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.pb i{display:block;height:100%;background:var(--mint)}

/* topics */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font-family:var(--display);border:3px solid var(--ink);border-radius:12px 12px 0 0;border-bottom-width:0;background:var(--paper);padding:8px 14px;min-height:44px}
.tab.on{background:var(--sun)}
.tlist{display:grid;gap:12px}
.titem{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:14px 16px;width:100%}
.titem b{font-family:var(--display);font-size:1.2rem}
.marks{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mark{font-size:.8rem;font-weight:700;border:2px solid var(--ink);border-radius:8px;padding:0 6px;white-space:nowrap;background:var(--paper)}
.mark.ok{background:#B9EFD8}

/* question */
.qt{font-family:var(--display);font-size:clamp(1.5rem,6.5vw,2.3rem);line-height:1.25;margin-bottom:10px}
.qt.long{font-family:var(--body);font-weight:700;font-size:1.25rem}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.05;margin:0 .1em}
.fr i{font-style:normal;padding:0 .2em}
.fr i:first-child{border-bottom:.12em solid currentColor}
.entry{display:flex;flex-direction:column;gap:12px;align-items:stretch;max-width:300px;margin:0 auto}
.ansbox{font-family:var(--display);font-size:2rem;text-align:center;border:3px dashed var(--ink);border-radius:14px;min-height:60px;display:flex;align-items:center;justify-content:center;background:var(--paper);font-variant-numeric:tabular-nums}
.ph{color:var(--soft)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{font-family:var(--display);font-size:1.4rem;border:3px solid var(--ink);border-radius:12px;background:#fff;min-height:52px}
.key:active{background:var(--sun)}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.choice{font-size:1.35rem;min-height:64px}
.fdb{font-weight:700;border-radius:12px;padding:10px 12px;margin:10px 0;border:2px solid var(--ink)}
.fdb.good{background:#B9EFD8}.fdb.bad{background:#FFE3A1}
.run{font-family:var(--display)}

/* ways */
.ways{padding:0;overflow:hidden}
.ways>h3{padding:14px 18px 8px}
.wtabs{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px}
.wtab{font-family:var(--display);font-size:.95rem;border:3px solid var(--ink);border-bottom:0;border-radius:12px 12px 0 0;background:var(--paper);padding:7px 11px;min-height:44px}
.wtab.on{background:var(--ink);color:#fff}
.wbody{border-top:3px solid var(--ink);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.wbody ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;max-width:60ch}
.vis{overflow-x:auto;padding:4px 0}
.dots{display:flex;flex-wrap:wrap;gap:6px 12px;max-width:300px}
.five{display:inline-flex;gap:3px}
.dot{width:19px;height:19px;border-radius:50%;border:2px solid var(--ink);display:inline-block;position:relative;background:var(--sky)}
.dot.b{background:var(--sun)} .dot.sm{width:12px;height:12px;border-width:1.5px}
.dot.x{background:#fff;opacity:.8}
.dot.x::after{content:"";position:absolute;left:-3px;right:-3px;top:6px;height:3px;background:var(--berry);transform:rotate(-45deg)}
.tfs{display:flex;gap:14px;flex-wrap:wrap}
.tf{display:grid;grid-template-columns:repeat(5,24px);border:2px solid var(--ink)}
.tf span{height:24px;border:1.5px solid var(--ink)}
.tf .a{background:var(--sky)} .tf .b{background:var(--sun)}
.bt{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
.bt .h{width:54px;height:54px;border:2px solid var(--ink);background:var(--mint);background-image:linear-gradient(#0003 1px,transparent 1px),linear-gradient(90deg,#0003 1px,transparent 1px);background-size:5.4px 5.4px}
.bt .t{width:10px;height:54px;border:2px solid var(--ink);background:var(--sky);background-image:linear-gradient(#0004 1px,transparent 1px);background-size:100% 5.4px}
.bt .os{display:grid;grid-template-columns:repeat(3,10px);gap:3px;margin-left:6px}
.bt .o{width:10px;height:10px;border:2px solid var(--ink);background:var(--sun)}
.grps{display:flex;flex-wrap:wrap;gap:8px}
.grp{display:flex;flex-wrap:wrap;gap:3px;align-content:center;justify-content:center;border:2px dashed var(--ink);border-radius:14px;padding:6px;width:84px;min-height:44px}
.grp .dot{width:14px;height:14px}
.arr{display:grid;gap:4px}
.fbar{display:flex;border:2px solid var(--ink);height:34px;max-width:300px;margin:4px 0}
.fbar span{flex:1;border-right:2px solid var(--ink);position:relative}
.fbar span:last-child{border-right:0}
.fbar .a{background:var(--sky)} .fbar .b{background:var(--sun)}
.fbar .x{background:repeating-linear-gradient(45deg,#fff 0 5px,var(--berry) 5px 7px)}
.tape{max-width:320px}
.tp{display:flex;border:2px solid var(--ink)}
.tp span{min-width:30px;text-align:center;padding:6px 2px;font-weight:700;border-right:2px solid var(--ink);background:#fff;font-size:.95rem}
.tp span:last-child{border-right:0}
.tp .a{background:#BFE0FF}.tp .b{background:#FFE08A}.tp .x{background:#FFC9D2}
.tt{text-align:center;font-weight:700;border:2px solid var(--ink);border-top:0;border-radius:0 0 12px 12px;padding:2px;font-size:.95rem}
.stk{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.3rem;font-weight:700;line-height:1.3;margin:0;display:inline-block;background:var(--paper);border-radius:10px;padding:8px 14px}
.area{border-collapse:collapse;font-weight:700}
.area th{padding:6px 10px}
.area td{border:2px solid var(--ink);padding:14px 18px;background:#FFE08A;text-align:center}
.area tr:nth-child(odd) td{background:#BFE0FF}
.nl{width:100%;max-width:360px;display:block}
.nl .ax{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.nl .hop{fill:none;stroke:var(--berry);stroke-width:2.5}
.nl text{font-family:var(--body);font-size:12px;text-anchor:middle;fill:var(--ink)}
.nl .hl{font-weight:700;fill:var(--berry);font-size:11px}
.nl .hi{font-weight:700;font-size:14px}

/* test */
.prog{display:flex;align-items:center;gap:10px;font-family:var(--display)}
.prog .pb{flex:1}
.clock{font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.score{font-family:var(--display);font-size:clamp(3rem,16vw,5rem);line-height:1}
.rev{display:flex;flex-direction:column;gap:8px}
.ri{border:2px solid var(--ink);border-radius:12px;padding:10px 12px;background:#fff;display:flex;flex-direction:column;gap:6px}
.ri.ok{border-left:10px solid var(--mint)} .ri.no{border-left:10px solid var(--berry)}
.ri .q{font-weight:700}
.hist{display:flex;flex-direction:column;gap:10px}
.hi2{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:12px;padding:10px 12px;background:#fff}

/* story + guided lesson */
.scene{font-size:3rem;text-align:center;letter-spacing:.25em;line-height:1.2}
.stx{font-size:1.2rem;line-height:1.6;max-width:56ch;margin-top:8px}
.door.h{background:#FFF1B8;grid-column:1/-1;min-height:0}
.pgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pgs .btn{min-width:48px;padding:6px 8px}
.pgs .btn.dn{background:#B9EFD8}
.gd{display:flex;gap:12px;align-items:flex-start}
.gd .av{font-size:3.4rem;animation:hop 1.6s ease-in-out infinite;flex:none}
.gd .says{font-size:1.15rem;margin-top:0;max-width:none;flex:1}
.gbody ol{margin:8px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.gbody ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.dotsrow{display:flex;gap:6px;justify-content:center}
.dotsrow i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:#fff}.dotsrow i.on{background:var(--sun)}

/* Digit the helper */
#digit{position:fixed;right:10px;bottom:10px;z-index:15;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
#digit>*{pointer-events:auto}
#dbtn{background:#fff;border:3px solid var(--ink);border-radius:50%;width:68px;height:68px;box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;padding:0}
#digit .mouth{transform-box:fill-box;transform-origin:center}
#digit.talk .mouth{animation:chat .22s infinite alternate}
#digit.talk #dbtn{animation:bob .5s ease-in-out infinite alternate}
@keyframes chat{to{transform:scaleY(2.8)}}
#dbub{max-width:min(290px,78vw);background:#fff;border:3px solid var(--ink);border-radius:16px 16px 4px 16px;padding:10px 12px;box-shadow:3px 3px 0 var(--ink);font-weight:700;display:flex;flex-direction:column;gap:8px}
#dbub[hidden]{display:none}
.wrap{padding-bottom:104px}
/* space + race */
#field{position:relative;height:250px;border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:#131A44;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#FFE08A 1px,transparent 1.5px);background-size:46px 46px,70px 70px;background-position:0 0,23px 31px}
#field.hit{animation:hit .35s}
@keyframes hit{50%{background-color:#7A1D33}}
.ground{position:absolute;left:0;right:0;bottom:0;height:16px;background:var(--mint);border-top:3px solid var(--ink)}
.ship{position:absolute;transform:translateX(-50%);width:86px;text-align:center;line-height:1}
.ship svg{display:block;margin:0 auto;animation:bob 1.2s ease-in-out infinite alternate}
.ship b{display:inline-block;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:8px;font-family:var(--display);font-size:1rem;padding:2px 5px;white-space:nowrap}
.ship.boom{font-size:2.6rem;animation:pop2 .35s}
.pad.p5{grid-template-columns:repeat(5,1fr)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.lane{position:relative;height:50px;border-bottom:3px dashed var(--ink);margin-bottom:6px}
.rk{position:absolute;top:6px;font-size:1.7rem;white-space:nowrap;transition:left .25s linear}
/* math words */
.wcard{display:flex;flex-direction:column;gap:4px}
.wcard b.w{font-family:var(--display);font-size:1.5rem}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.slots span{width:38px;height:46px;border:3px solid var(--ink);border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-size:1.5rem;background:var(--paper);text-transform:uppercase}
.slots span.f{background:#B9EFD8}
.ltiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ltiles .tile{width:52px;min-height:52px;text-transform:uppercase}
.ltiles .tile[disabled]{opacity:.25;box-shadow:none}
.door.w{background:#E4D9FF}.door.wide{grid-column:1/-1;min-height:0}

/* lesson path, celebration, new games */
.door[disabled]{opacity:.55;box-shadow:none}
.tile[disabled]{opacity:.5;box-shadow:none}.tile.dn,.tile.dn[disabled]{background:#B9EFD8;opacity:1}.tile.off{background:#BFE0FF;opacity:.35}
.tile small{font-size:.7rem;display:block}
.tile.hole{font-size:1.15rem;line-height:1.1;min-height:78px;background:#E9D8B8}.tile.hole.up{background:#FFE08A}
.train{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:2rem;margin:10px 0}
.car{font-family:var(--display);font-size:1.2rem;border:3px solid var(--ink);border-radius:10px;padding:8px 10px;background:#FFE08A;min-width:50px;text-align:center}
.car.q{background:#fff;border-style:dashed}
.cele{color:#fff;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:380px}
.cele h2{font-size:2.6rem}
.crowd{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;font-size:2.3rem}
.crowd span{display:inline-block;animation:jump .55s ease-in-out infinite alternate}
@keyframes jump{from{transform:translateY(0)}to{transform:translateY(-16px) rotate(6deg)}}
#celenote .card{color:var(--ink);animation:pop2 .4s cubic-bezier(.2,1.6,.4,1)}

.bignum{font-family:var(--display);font-size:5rem;line-height:1;color:var(--ink);background:#fff;border:4px solid var(--ink);border-radius:18px;min-width:1.4em;text-align:center;padding:6px 12px;display:inline-block;margin:6px 0}
.bignum.sm{font-size:2.4rem;border-width:3px;border-radius:12px;padding:2px 10px}
.cbn{width:100%;max-width:520px;height:auto;display:block;margin:0 auto;border:3px solid var(--ink);border-radius:14px;background:#fff;touch-action:manipulation}
.creg{cursor:pointer}.cbad{fill:#FFC9D2!important}
.clab{font-family:var(--display);font-size:17px;font-weight:800;fill:#16224A;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:3px}
.crayons{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.crayon{width:76px;height:76px;border:3px solid var(--ink);border-radius:18px;background:var(--cc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:3px 3px 0 var(--ink);color:#16224A;padding:0}
.crayon b{font-family:var(--display);font-size:1.6rem;line-height:1.1;background:#fff;border-radius:999px;min-width:1.6em}
.crayon span{font-size:1.1rem;line-height:1;font-weight:800}
.crayon.on{transform:translate(3px,3px);box-shadow:none;outline:4px solid var(--ink);outline-offset:3px}
/* Common Core visuals */
.pill.Common,.pill.cc{background:#C9F1FF}
.cctag{display:inline-block;font-size:.75rem;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:0 8px;background:#C9F1FF;margin-left:6px;white-space:nowrap}
.bond{width:170px;height:auto;display:block}
.cclen{display:flex;flex-direction:column;gap:6px;max-width:100%;overflow-x:auto}
.cclr{display:flex;align-items:center;gap:8px;min-height:26px}.cclr span{width:30px;font-size:1.3rem}.cclr i{height:20px;border:2px solid var(--ink);border-radius:6px;display:block}
.ccbars{display:flex;flex-direction:column;gap:6px;border:2px solid var(--ink);border-radius:12px;padding:10px;background:#fff;max-width:420px}
.ccb{display:flex;align-items:center;gap:8px}.ccb span{width:64px;font-weight:700;font-size:.9rem}.ccbt{flex:1;height:18px;background:var(--paper);border-radius:6px;overflow:hidden}.ccbt i{display:block;height:100%;background:var(--sky)}.ccb em{font-style:normal;font-weight:800;width:24px;text-align:right}
.ccplot{width:100%;max-width:360px;height:auto;display:block}
.ccshape{width:120px;height:auto;display:block}.ccshape.wide{width:240px}
.posgrid{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:2px;font-size:2rem;text-align:center;line-height:48px}
.pvc{border-collapse:collapse;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.2rem;font-weight:700}.pvc th{font-size:.75rem;padding:2px 6px}.pvc td{border:2px solid var(--ink);padding:4px 10px;text-align:center}.pvc td:nth-child(2){border:0;padding:4px 0}.pvc .pvt td{background:#B9EFD8}
/* buddy room */
.door.r{background:#FFD9EC}
.room{border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:linear-gradient(var(--wall) 0 64%,var(--floor) 64%);box-shadow:5px 5px 0 var(--ink);padding:10px}
.rgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rsp{aspect-ratio:1;min-height:48px;border:2px dashed rgba(22,34,74,.28);border-radius:12px;background:transparent;font-size:clamp(1.6rem,7vw,2.4rem);cursor:pointer;padding:0;line-height:1}
.rsp.full{border-color:transparent}
.rsp.tgt:not(.full){border-color:var(--ink);background:rgba(255,255,255,.45)}
.rbud{display:flex;align-items:flex-end;justify-content:center;font-size:clamp(2.6rem,12vw,4rem);line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.rbox{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.rtoy{width:56px;height:56px;font-size:2rem;border:2px solid var(--ink);border-radius:12px;background:#fff;cursor:pointer}
.rtoy.on{background:#FFE08A;box-shadow:0 0 0 4px #FFB81C}
.rshop{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:8px}
.ritem{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid var(--ink);border-radius:14px;padding:10px;background:#fff;text-align:center}
.ritem .re{font-size:2.2rem;line-height:1}
.rsw{width:48px;height:40px;border:2px solid var(--ink);border-radius:8px}
.adapt{background:#EFE7FF;border:2px solid var(--ink);border-radius:14px;padding:12px 14px;margin:10px auto;max-width:52ch;text-align:left}
@media (prefers-reduced-motion:reduce){.rbud{animation:none}}
/* stack it, inside a problem */
.pstack{border:2px solid var(--ink);border-radius:16px;background:#F4F0FF;padding:12px;margin:10px 0}
.pstack .vis{background:#fff;border-radius:12px;padding:8px;margin-top:8px}
/* comfortable tap targets */
@media (max-width:420px){#dbtn{width:56px;height:56px}#dbtn svg{width:42px;height:42px}#digit{right:6px;bottom:6px}}
input[type=checkbox]{width:24px;height:24px;margin:0;accent-color:var(--ink)}
label:has(> input[type=checkbox]){min-height:44px;cursor:pointer}
.pgs .btn.sm{min-width:52px}
/* stack math */
.sg{border-collapse:separate;border-spacing:2px;margin:6px auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:2.1rem;font-weight:700;font-variant-numeric:tabular-nums}
.sg td{width:1.25em;height:1.3em;text-align:center;padding:0;border-radius:8px}
.sg td.sign{color:var(--grape);width:auto;white-space:nowrap;padding-right:.2em;text-align:right}
.sg .mark td{font-size:1.05rem;height:1.4em;color:var(--berry)}
.sg .line td{height:5px;background:var(--ink);border-radius:3px}
.sg tr.mark{background:none;border:0;font-size:inherit}.sg td.hl{background:#FFE08A}
.sg td.xo{text-decoration:line-through;text-decoration-color:var(--berry);color:var(--soft)}
.sg .res td{color:var(--mint)}.sg .pp td{color:var(--sky)}
.dlog{margin:8px auto 0;padding-left:1.4em;max-width:280px;font-weight:700;display:flex;flex-direction:column;gap:2px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg .btn.on{background:var(--ink);color:#fff}
.btn[disabled]{opacity:.4;box-shadow:none}

/* badges */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.bdg{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:14px 10px}
.bdg b{font-family:var(--display);font-size:1.1rem}
.bdg small{font-size:.82rem;color:var(--soft)}
.bdg .pb{width:100%}
.st{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:2.4rem;border:4px solid var(--ink);background:#D8DEE8;box-shadow:inset 0 0 0 6px #fff,inset 0 0 0 8px var(--ink);transform:rotate(-6deg);filter:grayscale(1);opacity:.55}
.t1 .st{background:#D9905A;filter:none;opacity:1}.t2 .st{background:#B7C3D0;filter:none;opacity:1}.t3 .st{background:var(--sun);filter:none;opacity:1}
.tier{font-family:var(--display);font-size:.85rem;border:2px solid var(--ink);border-radius:999px;padding:0 10px;background:#fff}
#over{position:fixed;inset:0;background:#16224Acc;z-index:20;display:none;align-items:center;justify-content:center;padding:16px}
#over.on{display:flex;align-items:flex-start;overflow-y:auto}#over>*{margin:auto}
#over .card{max-width:340px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
#over .st{width:130px;height:130px;font-size:4rem;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2) rotate(-40deg)}to{transform:scale(1) rotate(-6deg)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:8px 14px;z-index:25;display:none;max-width:90%;text-align:center}

/* games */
div.sky{background:linear-gradient(#BFE0FF,#EAF2F9);border:3px solid var(--ink);border-radius:18px;padding:24px 8px 30px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;justify-items:center}
.bal{font-family:var(--display);font-size:1.25rem;width:100%;max-width:80px;aspect-ratio:4/5;border:3px solid var(--ink);border-radius:50% 50% 50% 50%/45% 45% 55% 55%;color:#fff;position:relative;animation:bob 2.6s ease-in-out infinite alternate}
.bal::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:22px;background:var(--ink)}
.bal:nth-child(1){background:var(--berry)}.bal:nth-child(2){background:var(--grape);animation-delay:-.7s}.bal:nth-child(3){background:var(--mint);animation-delay:-1.4s}.bal:nth-child(4){background:var(--sky);animation-delay:-2s}
.bal[disabled]{opacity:.25}
@keyframes bob{from{transform:translateY(6px)}to{transform:translateY(-8px)}}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{font-family:var(--display);font-size:1.1rem;min-height:74px;border:3px solid var(--ink);border-radius:12px;background:var(--grape);color:transparent;padding:4px;overflow-wrap:anywhere}
.mc.open{background:#fff;color:var(--ink)} .mc.done{background:#B9EFD8;color:var(--ink)}
.track{position:relative;height:92px;margin:26px 14px 6px;touch-action:manipulation;cursor:pointer}
.track::before{content:"";position:absolute;left:0;right:0;top:50px;height:6px;background:var(--ink);border-radius:3px}
.tk{position:absolute;top:42px;width:3px;height:22px;background:var(--ink);transform:translateX(-50%)}
.tk.mn{height:10px;top:48px;width:2px}
.tk b{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:.85rem;white-space:nowrap}
.mk{position:absolute;top:2px;font-size:2rem;transform:translateX(-50%);pointer-events:none}
.mk.flag{top:14px;font-size:1.5rem}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{font-family:var(--display);font-size:1.5rem;min-height:64px;border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:3px 3px 0 var(--ink)}
.tile.on{background:var(--sun);transform:translate(3px,3px);box-shadow:none}
table.gt{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
.gt th,.gt td{border-bottom:1px solid var(--grid);padding:5px 6px;text-align:left}
.tw{overflow-x:auto}
@media (max-width:400px){.doors{gap:10px}.door b{font-size:1.25rem}.card{padding:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.kpic{font-size:2rem;line-height:1.7;letter-spacing:.12em;margin:8px 0;word-break:break-word}
/* ===== Workbooks ===== */
.door.k{background:#FFE6C7}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.book{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border-left-width:14px;color:var(--ink)}
.book b{font-family:var(--display);font-size:1.35rem;line-height:1.1}
.book.b0{background:#FFE6C7;border-left-color:#FF8A3D}.book.b1{background:#FFE08A;border-left-color:#E0A000}.book.b2{background:#BFE0FF;border-left-color:#2F7FE0}
.book.b3{background:#B9EFD8;border-left-color:#14A06E}.book.b4{background:#FFC9D2;border-left-color:#E2445C}.book.b5{background:#D9CCFA;border-left-color:#7650D0}
.wsheet{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);overflow:hidden}
.wsheet .whead{padding:14px 18px;border-bottom:3px solid var(--ink);background:#FFF8E5;display:flex;flex-direction:column;gap:4px}
.wsheet .whead h2{font-size:1.35rem}
.wrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;padding:14px 14px 14px 10px;border-bottom:2px solid var(--grid)}
.wrow:last-child{border-bottom:0}
.wrow.ok{background:#E8FAF1}.wrow.no{background:#FFF0F2}
.wn{font-family:var(--display);font-size:1.1rem;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;background:var(--paper)}
.wq{font-weight:700;font-size:1.1rem;margin-bottom:6px}
.wmark{font-size:1.5rem;min-width:28px;text-align:center}
.whelp{border:2px solid var(--ink);background:#fff;border-radius:50%;width:44px;height:44px;font-weight:700;font-size:1.1rem}
.wsteps{margin:8px 0 0;padding:8px 10px 8px 2em;background:#FFF8E5;border-radius:10px;font-size:.95rem}
.wvis{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:4px 0 8px}
.wdots{display:inline-grid;grid-template-columns:repeat(3,auto);gap:4px;vertical-align:middle}
.wdots.w5{grid-template-columns:repeat(5,auto)}
.wd{width:22px;height:22px;border-radius:50%;display:inline-block;position:relative}
.wd.y{background:#FFC21A}.wd.b{background:#22AEEF}
.wd.x::after{content:"";position:absolute;left:-4px;right:-4px;top:9px;height:3px;background:var(--berry);transform:rotate(-45deg)}
.wd.x{opacity:.45}
.wplus{font-family:var(--display);font-size:1.6rem}
.wpics{font-size:1.7rem;line-height:1.4;letter-spacing:.08em}
.wans{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--display);font-size:1.5rem}
input.wbin{font:inherit;font-family:var(--display);font-size:1.4rem;width:2.6em;text-align:center;border:3px solid var(--ink);border-radius:10px;padding:4px 2px;background:#FFFDF5;color:var(--ink)}
input.wbin.wide{width:4.6em}
.wans{gap:6px}.wans>span{font-size:1.3rem}
input.wbin:disabled{background:#E8FAF1;border-color:var(--mint);opacity:1;color:var(--ink)}
.wopts{display:flex;flex-wrap:wrap;gap:8px}
.wopt{border:3px solid var(--ink);border-radius:12px;background:#fff;min-width:52px;min-height:48px;padding:6px 12px;font-family:var(--display);font-size:1.25rem}
.wopt.on{background:var(--sun);box-shadow:inset 0 0 0 3px #fff}
.wopt .wdots{pointer-events:none}
.wopt.grp{padding:10px;min-width:96px}
.wcol{display:flex;flex-wrap:wrap;gap:6px}
.wci{font-size:1.9rem;width:52px;height:52px;border:2px dashed var(--soft);border-radius:12px;background:#fff;padding:0;line-height:1}
.wci span{filter:grayscale(1);opacity:.75;display:inline-block}
.wci.on{border:3px solid var(--ink);background:#FFF1B8}.wci.on span{filter:none;opacity:1}
.wbig{font-family:var(--display);font-size:2rem;border:3px solid var(--ink);border-radius:12px;padding:0 12px;background:#fff;margin-right:6px}
#printarea{display:none}
@media print{
  @page{margin:14mm}
  body{background:#fff!important;font-size:12pt}
  #app,#bg,#digit,#fx,#toast,#over{display:none!important}
  #printarea{display:block;color:#000}
  .pw h1{font-family:var(--display);font-size:20pt;margin:0}
  .pw .pmeta{display:flex;gap:16px;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:6px;font-size:11pt}
  .pw .pins{font-size:12pt;margin:6px 0 10px}
  .pw table{width:100%;border-collapse:collapse}
  .pw td{border:1.5px solid #000;padding:8px 10px;vertical-align:middle}
  .pw td.pn{width:28px;text-align:center;font-weight:700}
  .pw tr{page-break-inside:avoid}
  .pw .wd{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pw .pl{display:inline-block;min-width:54px;border-bottom:2px solid #000;margin:0 4px;height:1.2em}
  .pw .pbox{display:inline-block;border:1.5px solid #000;border-radius:8px;padding:2px 10px;margin:2px 4px}
  .pw .wci{width:40px;height:40px;font-size:1.5rem;border:1.5px solid #000}
  .pkey{page-break-before:always}
  .pkey ol{columns:2;font-size:11pt}
}
</style>

<script>
//CORE-START
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fx=s=>esc(s).replace(/(\d+)\/(\d+)/g,'<span class="fr"><i>$1</i><i>$2</i></span>');
function RNG(seed){let t=seed>>>0;return()=>{t=(t+0x6D2B79F5)>>>0;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296}}
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const shuf=(r,a)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=x=>String(Number(Number(x).toFixed(2)));
const gcd=(a,b)=>b?gcd(b,a%b):a;
const fv=s=>{const[a,b]=String(s).split('/');return b?a/b:+a};
const parts=n=>{const o=[];let p=1;while(n>0){const d=n%10;if(d)o.unshift(d*p);n=Math.floor(n/10);p*=10}return o};
const PL=['ones','tens','hundreds','thousands','ten-thousands','hundred-thousands','millions'];

/* ---------- pictures ---------- */
function vDots(segs,cross=0){const cs=[];segs.forEach(([n,c])=>{for(let i=0;i<n;i++)cs.push(c)});const N=cs.length;let h='<div class="dots">';
  for(let i=0;i<N;i+=5)h+='<span class="five">'+cs.slice(i,i+5).map((c,j)=>`<span class="dot ${c}${i+j>=N-cross?' x':''}"></span>`).join('')+'</span>';return h+'</div>'}
function vTen(a,b){const c=[];for(let i=0;i<a;i++)c.push('a');for(let i=0;i<b;i++)c.push('b');
  const f=k=>'<div class="tf">'+Array.from({length:10},(_,i)=>`<span class="${c[k*10+i]||''}"></span>`).join('')+'</div>';return '<div class="tfs">'+f(0)+(a+b>10?f(1):'')+'</div>'}
function vBlocks(n){const h=Math.floor(n/100),t=Math.floor(n%100/10),o=n%10;return '<div class="bt">'+'<span class="h"></span>'.repeat(h)+'<span class="t"></span>'.repeat(t)+'<span class="os">'+'<span class="o"></span>'.repeat(o)+'</span></div>'}
function vLine(min,max,pts,hops=[]){if(max<=min)max=min+1;const X=v=>Math.round((26+(v-min)/(max-min)*288)*10)/10,y=hops.length?64:22;
  const seen={};pts=pts.filter(p=>!seen[p.v]&&(seen[p.v]=1)).sort((a,b)=>a.v-b.v);
  let s=`<svg class="nl" viewBox="0 0 340 ${y+44}" role="img" aria-label="Number line"><line x1="8" y1="${y}" x2="332" y2="${y}" class="ax"/>`;
  hops.forEach(h=>{const x1=X(h.a),x2=X(h.b),m=(x1+x2)/2,ht=Math.min(34,Math.abs(x2-x1)*.5+8);
    s+=`<path d="M${x1} ${y} Q${m} ${y-ht*2} ${x2} ${y}" class="hop"/>`+(h.l?`<text x="${m}" y="${y-ht-5}" class="hl">${h.l}</text>`:'')});
  let lx=-99,low=false;
  pts.forEach(p=>{const x=X(p.v);low=x-lx<26&&!low;lx=x;const l=p.l??fmt(p.v);
    s+=`<line x1="${x}" y1="${y-6}" x2="${x}" y2="${y+6}" class="ax"/><text x="${x}" y="${y+(low?37:21)}" class="pl${p.hi?' hi':''}">${l}</text>`});
  return s+'</svg>'}
function vGroups(g,n){return '<div class="grps">'+Array.from({length:g},()=>'<span class="grp">'+'<span class="dot a"></span>'.repeat(n)+'</span>').join('')+'</div>'}
function vArray(r,c){return `<div class="arr" style="grid-template-columns:repeat(${c},12px)">`+'<span class="dot b sm"></span>'.repeat(r*c)+'</div>'}
function vBar(n,d,m=0,c2='b'){return '<div class="fbar">'+Array.from({length:d},(_,i)=>`<span class="${i<n?'a':i<n+m?c2:''}"></span>`).join('')+'</div>'}
function vTape(ps,total){return '<div class="tape"><div class="tp">'+ps.map(p=>`<span style="flex:${p.f}" class="${p.c||''}">${esc(p.l)}</span>`).join('')+`</div><div class="tt">${esc(total)}</div></div>`}
function vStack(lines){return '<pre class="stk">'+lines.map(esc).join('\n')+'</pre>'}
function vArea(as,bs){let h='<table class="area"><tr><th>×</th>'+as.map(a=>`<th>${a}</th>`).join('')+'</tr>';bs.forEach(b=>{h+=`<tr><th>${b}</th>`+as.map(a=>`<td>${a*b}</td>`).join('')+'</tr>'});return h+'</table>'}

/* ---------- ways to solve ---------- */
const way=(name,tag,steps,vis='')=>({name,tag,steps,vis});
function addWays(a,b){const s=a+b,W=[],big=Math.max(a,b),sm=Math.min(a,b);
  if(s<=30)W.push(way('Draw it','Picture',[`Draw ${a} blue dots.`,`Draw ${b} yellow dots.`,`Count them all: ${s}.`],vDots([[a,'a'],[b,'b']])));
  {const hops=[],pts=[{v:big}];let c=big;const ones=sm<=10&&s<=30;
    if(ones){for(let i=0;i<sm;i++){hops.push({a:c,b:c+1,l:sm<=6?'+1':''});c++}pts.push({v:s,hi:1})}

topic('cmp1',1,'Comparing numbers','Use < for less than, > for greater than, and = when two numbers are the same.',r=>{const a=ri(r,1,99),b=r()<.12?a:ri(r,1,99);return MC(`Which sign fits?  ${a} ◯ ${b}`,a<b?'<':a>b?'>':'=',['<','>','='],{a,b})},

topic('cmpfrac',4,'Comparing fractions','To compare fractions, make the pieces the same size or picture them side by side.',r=>{const ds=[2,3,4,5,6,8,10];let d1=pick(r,ds),d2=pick(r,ds),n1=ri(r,1,d1-1),n2=ri(r,1,d2-1);if(d1==d2&&n1==n2)n2=n2>1?n2-1:n2+1==d2?n2:n2+1;const x=n1*d2,y=n2*d1;return MC(`Which sign fits?  ${n1}/${d1} ◯ ${n2}/${d2}`,x<y?'<':x>y?'>':'=',['<','>','='],{n1,d1,n2,d2})},

topic('fracunlike',5,'Adding fractions with different bottoms','Before you add, cut the pieces so both fractions use the same size piece.',r=>{let d1,d2,n1,n2,L,num,g=0;do{[d1,d2]=pick(r,[[2,3],[2,4],[3,6],[2,5],[3,4],[4,8],[2,6],[5,10],[3,9],[4,6]]);n1=ri(r,1,d1-1);n2=ri(r,1,d2-1);L=d1*d2/gcd(d1,d2);num=n1*L/d1+n2*L/d2}while(num>=L&&g++<30);if(num>=L){n1=n2=1;num=L/d1+L/d2}

topic('ooo',5,'Order of operations','When a problem mixes operations, there is an agreed order so everyone gets the same answer.',r=>{const k=ri(r,0,3),a=ri(r,2,9),b=ri(r,2,9),c=ri(r,2,6);let q,ans,steps,lines;

topic('vol',5,'Volume','Volume is how many unit cubes fill a box.',r=>{const l=ri(r,2,6),w=ri(r,2,5),h=ri(r,2,5);return P(`A box is ${l} cubes long, ${w} cubes wide and ${h} cubes tall. How many cubes fill it?`,l*w*h,{l,w,h})},

topic('pct',6,'Percents','Percent means out of 100. 25% is 25 out of every 100.',r=>{const pc=pick(r,[10,20,25,50,75,5,30]),n=20*ri(r,1,12);return P(`${pc}% of ${n} = ?`,fmt(pc*n/100),{pc,n})},

topic('ints',6,'Negative numbers','Numbers keep going below zero. Adding moves right on the number line. Subtracting moves left.',r=>{const a=ri(r,1,12),b=ri(r,1,12),k=ri(r,0,3);

  if(m==1)return MC('Find the same number.',t,KNCH(r,t,top,zero),{steps:[`Look at the number: ${t}.`,`Find the button that looks just the same.`,`We say "${KNW[t]}".`],say:[`This number is "${KNW[t]}".`]},{vis:KBIG(t)});
  if(m==2){const nums=KNCH(r,t,Math.min(top,6),zero).map(Number).slice(0,3);if(!nums.includes(t))nums[0]=t;const ch=shuf(r,[...new Set(nums)]).map(n=>KSHOW(n,e));
   return MC('Which one shows this many?',KSHOW(t,e),ch,{steps:[`The number is ${t}.`,t?`Count each group. Find the one with ${t}.`:'Zero means none. Find the empty plate.'],say:[`${t} is "${KNW[t]}".`]},{vis:KBIG(t)})}
  const n=ri(r,0,9);return MC(`What number comes after ${n}?`,n+1,KNCH(r,n+1,10,true),{steps:['Count up from the number.',`${n}, then ${n+1}.`],say:[`After ${n} comes ${n+1}.`]})}};

  else if(m=='up')body=`<h2>Create a family account</h2><p class="muted" style="margin-top:6px">We will email you one time to confirm your address. After that you sign in with your password.</p>${em}${pw('Choose a password (at least 8 characters)','new-password')}<div class="row" style="margin-top:12px"><button class="btn go" data-act="pwup">Create account</button></div>${err}<div class="row" style="margin-top:14px">${link('amin','I already have an account')}</div>`;
  else if(m=='forgot')body=`<h2>Set a new password</h2><p class="muted" style="margin-top:6px">We will email you a link. Open it on this device, then choose your password.</p>${em}<div class="row" style="margin-top:12px"><button class="btn go" data-act="pwforgot">Email me the link</button></div>${err}<div class="row" style="margin-top:14px">${link('amin','Back to sign-in')}</div>`;
  else body=`<h2>Check your email</h2><p style="margin-top:8px">${S.amsg||''}</p><div class="row" style="margin-top:14px">${link('amin','Back to sign-in')}</div>`;

V.setpw=()=>`<main class="wrap"><div class="hero"><h1>Many <em>Ways</em> Math</h1></div><div class="card"><h2>Choose your password</h2><p class="muted" style="margin-top:6px">Use this password to sign in on any device. This device stays signed in until you sign out.</p><label for="pw" style="display:block;margin-top:12px;font-weight:700">New password (at least 8 characters)</label><input id="pw" type="${S.showpw?'text':'password'}" autocomplete="new-password" ${AF}><label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-weight:400"><input type="checkbox" id="showpw"${S.showpw?' checked':''} data-act="showpw"> Show password</label><div class="row" style="margin-top:12px"><button class="btn go" data-act="pwset">Save password</button>${S.kids&&S.kids.length&&!window.MWM_RECOVERY?'<button class="btn" data-act="go" data-s="grown">Cancel</button>':''}</div>${S.authErr?`<p role="alert" style="margin-top:10px;color:var(--berry);font-weight:700">${esc(S.authErr)}</p>`:''}</div></main>`;
V.load=()=>`<main class="wrap"><div class="hero"><h1>Many <em>Ways</em> Math</h1></div><div class="card"><p>Getting your profiles ready…</p></div></main>`;
V.who=()=>`<main class="wrap"><div class="hero"><h1>Many <em>Ways</em> Math</h1><p style="max-width:44ch;margin-top:8px">Every problem has more than one way in. Pick the way that makes sense to you.</p></div>
  <h2>Who is doing math today?</h2><div class="kids">${S.kids.map(k=>`<button class="card kid" data-act="login" data-id="${k.id}"><span class="av">${k.av}</span><b>${esc(k.name)}</b><span class="muted">${k.age?"Age "+k.age+" · ":""}${k.sg?'Grade '+k.sg:'Kindergarten'} · ★ ${k.stars}</span></button>`).join('')}
  <button class="card kid add" data-act="newkid"><span class="av">＋</span><b>New player</b><span class="muted">Make a profile</span></button></div>
  <div class="row sp"><span class="muted">${store.mode=='cloud'?'Progress is saved to your family account.':'Progress is saved on this device.'}</span>${store.mode=='cloud'?'<button class="btn ghost sm" data-act="signout" style="background:#fff;color:#16224A">Sign out</button>':''}${S.kids.length?'<button class="btn ghost sm" data-act="go" data-s="grown">For grown-ups</button>':''}</div></main>`;
V.new=()=>{const f=S.form;return bar('Set up your profile','who')+`<main class="wrap"><div class="card" style="display:flex;flex-direction:column;gap:18px">
  <div class="field"><label for="nm">Your first name</label><input type="text" id="nm" maxlength="14" autocomplete="off" value="${esc(f.name)}"></div>
  <div><label>How old are you?</label><div class="pick g">${[5,6,7,8,9,10,11,12].map(a=>`<button class="${f.age==a?'on':''}" data-act="fage" data-v="${a}" aria-pressed="${f.age==a}">${a}</button>`).join('')}</div></div>
  <div><label>What grade are you in?</label><div class="pick g">${[0,1,2,3,4,5].map(g=>`<button class="${f.g==g?'on':''}" data-act="fg" data-v="${g}" aria-pressed="${f.g==g}">${g?g:'K'}</button>`).join('')}</div></div>

  <button class="btn go" data-act="savekid">Start</button></div></main>`};
V.code=()=>{const k=S.kids.find(x=>x.id==S.pend);return bar('Secret code','who')+`<main class="wrap"><div class="card" style="text-align:center"><div class="av">${k.av}</div><h2>Hi ${esc(k.name)}!</h2><p style="margin:8px 0 14px">Tap your 3 secret pictures in order.</p><div class="pick" style="justify-content:center">${CODE.map(a=>`<button data-act="ctap" data-v="${a}">${a}</button>`).join('')}</div><p style="font-size:1.6rem;min-height:1.7em;margin-top:10px">${S.tryc.map(()=>'●').join(' ')}</p>${S.cerr?'<p class="fdb bad">That is not the code. Try again.</p>':''}<p class="muted">Forgot it? A grown-up can remove the code.</p></div></main>`};
V.buddy=()=>{const k=K();return bar('Change your buddy','home')+`<main class="wrap"><div class="card" style="display:flex;gap:16px;align-items:center"><span class="av" style="font-size:4rem;animation:hop 1.6s ease-in-out infinite;display:inline-block">${k.av}</span><div><h2>This is your buddy</h2><p>Tap a new buddy below. It changes right away.</p></div></div><div class="card">${buddyPick(k.av,'setbuddy')}</div><div><button class="btn go" data-act="go" data-s="home">Done</button></div></main>`};
V.home=()=>{const k=K();let nb=null,br=-1;BADGES.forEach(b=>{const t=tierOf(b,k),n=b.tiers[t];if(n){const p0=t?b.tiers[t-1]:0,r=(b.val(k)-p0)/(n-p0);if(r>br){br=r;nb=[b,t,n]}}});
  return `<header class="bar"><h1>Many Ways Math</h1><button class="btn ghost sm" data-act="mute" style="background:#fff;color:#16224A" aria-pressed="${!S.mute}">${S.mute?"Sound off":"Sound on"}</button><button class="btn ghost sm" data-act="logout" style="background:#fff;color:#16224A">Switch</button></header><main class="wrap">
  <div class="card me"><button class="buddybtn" data-act="go" data-s="buddy" aria-label="Change your buddy"><span class="av">${k.av}</span><span class="bchg">Change</span></button><div><h2>Hi, ${esc(k.name)}!</h2><div class="stat"><span>★ ${k.stars}</span>${k.age?`<span>Age ${k.age}</span>`:''}<span>${k.sg?'Grade '+k.sg:'Kindergarten'}</span><span>${level(k)}</span><span>${k.streak} day${k.streak==1?'':'s'} in a row</span></div><div class="says">${k.av} ${S.say}</div></div></div>
  <div class="card row sp" style="padding:12px 16px"><span>Games and practice level: <b>${gname(k.g)}</b></span><span class="row"><button class="btn sm" data-act="lvl" data-v="-1"${k.g<=1?' disabled':''}>Easier</button><button class="btn sm go" data-act="lvl" data-v="1"${k.g>=6?' disabled':''}>Harder</button></span></div>
  ${k.intro?'':`<div class="card" style="background:#FFF1B8;display:flex;flex-direction:column;gap:10px"><h2>Start here</h2><p>Your buddy will walk you through your first lesson. It takes about 3 minutes.</p><div><button class="btn go" data-act="guide">Begin the guided lesson</button></div></div>`}
  ${(()=>{const P=k.path,si=setInfo(k),td=P.today.d==today()?P.today.n:0,wkd=P.week.w==wk()&&P.week.done,ng=nextGame(k);return `<div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="row sp"><h2>Today</h2><span class="pill">Set ${P.set+1}: ${si.name}</span></div>
  <div class="hi2"><div><b>Today's lessons</b><br><span class="muted">${P.lesson>=20?'All 20 lessons are done. Time for the set test!':`Lesson ${P.lesson+1} of 20: ${lname(si.plan[P.lesson])}`}${td?` · ${td} done today ✓ Keep going as long as you like!`:''}</span></div><button class="btn go" data-act="${P.lesson>=20?'settest':'dlstart'}" data-i="${P.lesson}">${P.lesson>=20?'Take the test':td?'Next lesson':'Start'}</button></div>
  <div class="hi2"><div><b>Weekly lesson</b><br><span class="muted">${wkd?`Done this week ✓ ${P.week.score} of 10 right`:'A bigger review of the math from this week.'}</span></div><button class="btn ${wkd?'':'grape'}" data-act="wkstart">${wkd?'Do it again':'Start'}</button></div>
  <div class="pb"><i style="width:${Math.max(3,P.lesson/20*100)}%"></i></div><div class="row sp"><span class="muted">${ng?`Finish this set and pass its test to unlock ${ng.name}.`:'Every game is unlocked.'}</span><button class="btn ghost sm" data-act="go" data-s="path">See all my lessons</button></div></div>`})()}
  <div class="doors"><button class="card door h" data-act="go" data-s="story"><div class="row sp"><b>Story: ${STORY.title}</b><span>${k.story.page>=20?'Finished! Read it again.':k.story.page?`Page ${k.story.page+1} of 20`:'Start the adventure'}</span></div><span>Solve the problem on each page to find out what happens next.</span><div class="pb"><i style="width:${Math.max(3,k.story.page/20*100)}%"></i></div></button>
  <button class="card door a" data-act="learn"><b>Practice Library</b><span>Pick any topic. See many ways to solve, then try it.</span></button>
  <button class="card door f" data-act="stack"><b>Stack Math</b><span>Line numbers up and solve + − × ÷ one column at a time.</span></button>
  <button class="card door k" data-act="go" data-s="wbshelf"><b>Workbooks</b><span>Worksheet pages to fill in, check and print. ${wbBook(k,wbMine(k)).done} of ${wbCount(wbMine(k))} done in your book.</span></button>
  <button class="card door w" data-act="words"><b>Math Words</b><span>Learn what math words mean and how to spell them.</span></button>
  <button class="card door b" data-act="go" data-s="tests"><b>Tests</b><span>Regular tests and 90-second sprints.</span></button>
  <button class="card door d" data-act="go" data-s="fix"><b>Fix-It Notebook</b><span>${k.missed.length?k.missed.length+' to try again.':'Missed problems land here.'}</span></button>
  <button class="card door r wide" data-act="go" data-s="room"><b>${k.av} My buddy's room</b><span>★ ${wallet(k)} stars to spend on toys. ${roomOf(k).own.length} of ${RITEMS.length} toys collected.</span></button>
  <button class="card door c wide" data-act="go" data-s="games"><b>Game Center</b><span>${unl(k)} of 15 games unlocked. Finish lesson sets to open more.</span></button>
  ${K().g==6?`<button class="card door g" data-act="grade6"><b>Challenge Zone</b><span>Powers, percents, negative numbers, mystery numbers and ratios.</span></button>`:''}
  <button class="card door e" data-act="go" data-s="badges"><div class="row sp"><b>Badges</b><span>${Object.values(k.badges).filter(Boolean).length} of ${BADGES.length} started</span></div>${nb?`<span>Next up: ${nb[0].name} ${TIER[nb[1]+1]}. ${nb[0].val(k)} of ${nb[2]} ${nb[0].unit}.</span><div class="pb"><i style="width:${Math.max(4,br*100)}%"></i></div>`:''}</button></div>${k.intro?'<div><button class="btn ghost sm" data-act="guide" style="background:#fff">Watch the guided lesson again</button></div>':''}</main>`};
V.topics=()=>{const k=K();if(S.g==6&&k.g!=6)S.g=k.g;return bar('Practice Library','home')+`<main class="wrap"><div><div class="tabs" role="tablist">${[0,1,2,3,4,5,...(k.g==6?[6]:[])].map(g=>`<button class="tab${S.g==g?' on':''}" role="tab" aria-selected="${S.g==g}" data-act="grade" data-v="${g}">${gname(g)}</button>`).join('')}</div>
  <div class="card" style="border-top-left-radius:0"><div class="tlist">${TL.filter(t=>t.g==S.g).map(t=>{const s=k.t[t.id]||{};return `<button class="btn titem" data-act="go" data-s="topic" data-tid="${t.id}"><b>${t.name}</b><span class="marks">${t.cc?`<span class="mark">${t.cc}</span>`:''}${s.lesson?'<span class="mark ok">Lesson ✓</span>':''}${s.n?`<span class="mark">${pct(s.c,s.n)}% right</span>`:''}${s.best!=null?`<span class="mark${s.best>=8?' ok':''}">Test ${s.best}/10</span>`:''}</span></button>`}).join('')}</div></div></div></main>`};
V.topic=()=>{const t=T[S.tid],s=K().t[t.id]||{};return bar(t.name,'topics')+`<main class="wrap"><div class="card"><span class="pill">Big idea</span>${t.cc?`<span class="cctag">Common Core ${t.cc}</span>`:''}<p style="font-size:1.2rem;margin-top:8px;max-width:50ch">${t.intro}</p>${t.cc?`<p class="muted" style="margin-top:6px">${esc(ccDesc(t.cc))}</p>`:''}</div>
  <div class="doors"><button class="card door a" data-act="lesson"><b>1. Lesson</b><span>${s.lesson?'Done. Look again any time.':'See the different ways to solve.'}</span></button>

  <button class="card door b" data-act="test" data-tid="${t.id}" data-kind="test"><b>3. Test</b><span>${s.best!=null?`Best: ${s.best} out of 10. New questions every time.`:'10 questions. 8 right to pass.'}</span></button>

V.lesson=()=>{const t=T[S.tid],p=S.ls.p;return bar(t.name+' lesson','topic')+`<main class="wrap"><div class="card"><span class="pill">Example</span>${qHTML(p)}<p class="muted">Tap each tab below. They all reach the same answer: <b>${fx(SIGN[p.a]||p.a)}</b></p></div>
  ${waysHTML(p,'Tap a way to see it')}<div class="row"><button class="btn" data-act="lsnew">Show another example</button><button class="btn go" data-act="practice">I am ready to practice</button></div></main>`};
V.practice=()=>{const s=S.pr,p=s.p,k=K();return bar(T[p.tid].name,s.fix!=null?'fix':'topic')+`<main class="wrap"><div class="card">${s.fix!=null?'<span class="pill">A new problem like one you missed</span>':''}${qHTML(p)}
  ${s.done?`<div class="fdb ${s.ok?'good':'bad'}" role="status">${s.msg}</div><button class="btn go" data-act="pnext">${s.fix!=null?'Back to the notebook':'Next problem'}</button>`:(s.msg?`<div class="fdb bad" role="status">${s.msg}</div>`:'')+entryHTML(p)}</div>
  <div class="row sp"><button class="btn ghost" data-act="hint">${s.hint?'Hide the ways':'Show me a way'}</button><span class="run">In a row: ${k.run}</span></div>${s.hint||(s.done&&!s.ok)?waysHTML(p):''}</main>`};
V.tests=()=>{const k=K();return bar('Tests','home')+`<main class="wrap"><div class="doors"><button class="card door b" data-act="test" data-tid="mix" data-kind="test"><b>${gname(k.g)} mixed test</b><span>10 questions from every ${gname(k.g)} topic.</span></button>
  <button class="card door d" data-act="test" data-tid="mix" data-kind="timed"><b>${gname(k.g)} sprint</b><span>Quick facts. 90 seconds.</span></button></div>
  <p class="muted">Want a test on one topic? Open it in <button class="btn ghost sm" data-act="go" data-s="topics">Learn &amp; Practice</button></p>
  <div class="card"><h3>Tests you have taken</h3><p class="muted" style="margin:4px 0 12px">Look at an old test, or take a new version. The new version tests the same skills with different questions.</p>

V.test=()=>{const s=S.ts,p=s.probs[s.i],tm=s.cfg.kind=='timed';return `<header class="bar"><button class="back" data-act="go" data-s="${s.cfg.tid=='set'?'path':s.cfg.tid=='mix'?'tests':'topic'}" aria-label="Quit test">✕</button><h1>${esc(tname(s.cfg))}</h1>${tm?'<span class="stars clock" id="clock">1:30</span>':''}</header><main class="wrap">
  <div class="prog">${tm?`<span>${s.ans.filter((v,i)=>isRight(s.probs[i],v)).length} right so far</span>`:`<span>Question ${s.i+1} of ${s.n}</span><div class="pb"><i style="width:${s.i/s.n*100}%"></i></div>`}</div>
  <div class="card">${qHTML(p)}${entryHTML(p)}</div><div class="row"><button class="btn ghost" data-act="skip">Skip this one</button></div></main>`};
V.result=()=>{const{e,probs,fresh,old}=S.res,k=K(),tm=e.kind=='timed';const good=tm?e.score>=10:e.score>=8;
  return bar('Results','tests')+`<main class="wrap"><div class="card" style="text-align:center"><p><b>${esc(tname(e))}</b> · ${fdate(e.ts)}</p><div class="score">${e.score}${tm?'':'<span style="font-size:.45em"> out of '+e.total+'</span>'}</div><p style="font-size:1.15rem;margin-top:6px">${tm?'right in 90 seconds':''} ${fresh?(e.tid=='set'&&e.score<8?'You need 8 right to pass the set. Your misses are in the Fix-It Notebook. Take a new version when you are ready.':e.score==e.total&&!tm?'A perfect paper!':good?'Strong work.':'Every miss is in your Fix-It Notebook. Try a new version when you are ready.'):''}</p>
  ${fresh&&old!=null?`<p class="fdb ${e.score>old?'good':'bad'}">${e.score>old?`You beat your old score of ${old}. That is a comeback!`:`Your old score was ${old}. You can try again any time.`}</p>`:''}
  <div class="row" style="justify-content:center;margin-top:12px"><button class="btn go" data-act="retake" data-id="${e.id}">Take a new version</button><button class="btn" data-act="go" data-s="home">Home</button></div></div>
  <div class="card"><h3>Look back at each question</h3><div class="rev" style="margin-top:10px">${probs.slice(0,e.ans.length).map((p,i)=>`<div class="ri ${e.ok[i]?'ok':'no'}"><div class="q">${i+1}. ${fx(p.q)}</div>${p.vis||''}<div>${e.ok[i]?'You answered ':'You said '}<b>${e.ans[i]===''?'(skipped)':fx(e.ans[i])}</b>${e.ok[i]?' ✓':` · The answer is <b>${fx(p.a)}</b>`}</div><div><button class="btn ghost sm" data-act="rv" data-i="${i}">${S.rv==i?'Hide the ways':'Show the ways'}</button></div>${S.rv==i?waysHTML(p):''}</div>`).join('')||'<p>No questions were answered.</p>'}</div></div></main>`};
V.fix=()=>{const k=K();return bar('Fix-It Notebook','home')+`<main class="wrap"><div class="card"><p style="max-width:52ch">These are problems you missed. Tap one to get a <b>new problem of the same kind</b>. Solve it and the old one leaves your notebook.</p></div>

V.badges=()=>{const k=K();return bar('Badges','home')+`<main class="wrap"><p style="max-width:52ch">Each badge has three levels: Bronze, Silver and Gold. They take real work, so each one means something.</p><div class="bgrid">${BADGES.map(b=>badgeCard(b,k)).join('')}</div></main>`};
V.games=()=>{const k=K(),n=unl(k);return bar('Game Center','home')+`<main class="wrap">${k.sg===0?`<button class="card door k wide" data-act="game" data-id="color"><b>🖍️ Color by Number</b><span>Just for Kindergarten. Match each number to its crayon.</span><span class="muted">${k.games.color&&k.games.color.wins?k.games.color.wins+' picture'+(k.games.color.wins>1?'s':'')+' colored':'6 pictures to color'}</span></button>`:''}<p style="max-width:56ch">${n>=15?'Every game is unlocked!':`<b>${n} of 15 games unlocked.</b> Finish a set of 20 lessons and pass its test to unlock the next one.`}</p><div class="doors">${GAMES.map((g,i)=>{const open=i<n||k.games[g.id]?.wins,w=k.games[g.id]?.wins;return `<button class="card door ${'dcabfgw'[i%7]}" data-act="game" data-id="${g.id}"${open?'':' disabled'}><b>${open?'':'🔒 '}${g.name}</b><span>${open?g.desc:`Locked. Finish ${i-n+1} more lesson set${i-n?'s':''} to unlock.`}</span>${open?`<span class="muted">${w?w+' win'+(w>1?'s':''):'Not won yet'}</span>`:''}</button>`}).join('')}</div><p class="muted">Games use ${gname(k.g)} math.</p></main>`};
