  return{kind:'tap',q:more?'Which group has MORE?':'Which group has LESS?',opts:[{h:WGRP(a,e1),v:'A',g:1},{h:WGRP(b,e2),v:'B',g:1},...(j>=5?[{h:'Same',v:'S'}]:[])],a:ans,steps:[`Count the first group: ${a}.`,`Count the second group: ${b}.`,a==b?'They are the same.':`${Math.max(a,b)} is more than ${Math.min(a,b)}.`]}}},
{name:'Number order',ins:'Write the missing number.',
 gen:(r,j,i)=>{const cap=Math.min(20,8+j),s=ri(r,0,cap-3),pos=j<5?3:ri(r,1,3),parts=[];for(let k=0;k<4;k++){if(k)parts.push({t:','});parts.push(k==pos?{a:String(s+k)}:{t:String(s+k)})}
  return{kind:'eq',q:'Fill in the missing number.',parts,steps:['Say the numbers in order.',`${s}, ${s+1}, ${s+2}, ${s+3}.`]}}},
{name:'Adding with pictures',ins:'Count the circles. Write the numbers and find the sum.',
 gen:(r,j,i)=>{const cap=j<5?5:10,s=ri(r,2,cap),a=ri(r,1,s-1),b=s-a;return{kind:'eq',q:'',vis:WDOTS(a,'y')+'<span class="wplus">+</span>'+WDOTS(b,'b'),parts:[{a:String(a)},{t:'+'},{a:String(b)},{t:'='},{a:String(s)}],steps:[`Count the yellow circles: ${a}.`,`Count the blue circles: ${b}.`,`Count them all together: ${a} + ${b} = ${s}.`]}}},

   const nx=abb?b:a;return{kind:'tap',q:'What comes next?',vis:`<div class="wpics">${seq.join('')}❓</div>`,opts:shuf(r,[a,b,c]).map(v=>({h:v,v})),a:nx,steps:['Find the part that repeats.',`The pattern starts again, so next is ${nx}.`]}}

];
const WBU=g=>g==0?KW:[G1U,G2U,G3U,G4U,G5U][g-1];
const wbTitle=g=>`${gname(g)} Workbook`;
const wbN=g=>g<=1?6:8;
const isNum=a=>/^-?\d+(\.\d+)?$/.test(String(a).trim());
function wbConvert(p){const steps=(p.d&&p.d.steps)||[];if(isNum(p.a))return{kind:'blank',q:p.q,vis:p.vis||'',a:String(p.a),steps};
  const ch=p.choices&&p.choices.length?p.choices:[p.a];return{kind:'tap',q:p.q,vis:p.vis||'',opts:ch.map(c=>({h:fx(c),v:String(c)})),a:String(p.a),steps}}
function wbFixTap(row){if(row.kind=='tap'&&!row.opts.some(o=>o.v==row.a))row.opts.push({h:fx(row.a),v:row.a});return row}
function wbPage(g,p,seed){const r=RNG(seed),U=WBU(g),u=Math.floor(p/15),j=p%15,n=wbN(g),rows=[],seen=new Set();
  for(let i=0;i<n;i++){let row,key;for(let t=0;t<8;t++){
      if(g==0){row=U[u].gen(r,j,i)}else{const rev=u>0&&i>=n-2,uu=rev?ri(r,0,u-1):u,jj=rev?ri(r,0,14):j;row=wbConvert(U[uu].gen(r,jj));row.unit=uu}
      key=(g==0&&row.kind=='blank'?row.q+'|'+row.a:row.q+'|'+(row.vis||''))+'|'+JSON.stringify(row.parts||row.items||'');if(!seen.has(key))break}
    seen.add(key);
    rows.push(wbFixTap(row))}
  return{g,p,u,j,rows,unit:U[u].name,ins:g==0?U[u].ins:'Solve each problem. Write your answer in the box, or tap your answer.',vals:rows.map(rw=>rw.kind=='eq'?rw.parts.map(()=>''):['']),sel:rows.map(()=>null),col:rows.map(()=>[]),res:rows.map(()=>null),checks:0,first:null,done:0,hint:-1,seed}}
function wbRowOk(pg,i){const rw=pg.rows[i],v=pg.vals[i],same=(x,y)=>isNum(y)?(String(x).trim()!==''&&Math.abs(parseFloat(x)-parseFloat(y))<1e-9):String(x).trim().toLowerCase()==String(y).toLowerCase();
  if(rw.kind=='blank')return same(v[0],rw.a);
  if(rw.kind=='eq')return rw.parts.every((pt,k)=>pt.a==null||same(v[k],pt.a));
  if(rw.kind=='tap')return pg.sel[i]!=null&&pg.sel[i]==rw.a;
  if(rw.kind=='color'){const c=pg.col[i];if(rw.items.some(x=>x.ok))return rw.items.every((x,k)=>!!x.ok==c.includes(k));return c.length==rw.need}
  return false}
const wbAns=rw=>rw.kind=='blank'||rw.kind=='tap'?(rw.kind=='tap'&&rw.opts.find(o=>o.v==rw.a)?rw.opts.find(o=>o.v==rw.a).h:fx(rw.a)):rw.kind=='eq'?rw.parts.map(p=>p.a!=null?`<b>${p.a}</b>`:p.t).join(' '):rw.items.some(x=>x.ok)?'Color: '+rw.items.filter(x=>x.ok).map(x=>x.e).join(''):`Color ${rw.need}`;
const wbBook=(k,g)=>{k.wb=k.wb||{};return k.wb[g]||(k.wb[g]={done:0,sc:{}})};
const wbMine=k=>k.sg==null?Math.min(5,Math.max(0,k.g)):Math.min(5,Math.max(0,k.sg));

V.wbshelf=()=>{const k=K(),mine=wbMine(k);return bar('Workbooks','home')+`<main class="wrap"><p style="max-width:56ch">Each workbook has 150 pages in 10 units. Fill in a page, tap <b>Check my page</b>, and fix anything with a red mark. Finishing a page opens the next one.</p>

V.wbook=()=>{const k=K(),g=S.wbg,b=wbBook(k,g),U=WBU(g);return bar(wbTitle(g),'wbshelf')+`<main class="wrap"><div class="card" style="display:flex;flex-direction:column;gap:10px"><h2>${wbTitle(g)}</h2><div class="pb"><i style="width:${Math.max(3,b.done/150*100)}%"></i></div><p><b>${b.done} of 150 pages done.</b></p><div><button class="btn go" data-act="wbgo" data-p="${Math.min(b.done,149)}">${b.done>=150?'Do page 1 again':b.done?'Keep going: page '+(b.done+1):'Start page 1'}</button></div></div>
  ${U.map((u,ui)=>`<div class="card"><h3>Unit ${ui+1}: ${u.name}</h3><div class="pgs">${Array.from({length:15},(_,jj)=>{const p=ui*15+jj,dn=p<b.done;return `<button class="btn sm${dn?' dn':''}" data-act="wbgo" data-p="${p}"${p>b.done?' disabled aria-label="Page '+(p+1)+', locked"':''}>${dn?'✓ ':''}${p+1}</button>`}).join('')}</div></div>`).join('')}</main>`};
function wbRowHTML(pg,i){const rw=pg.rows[i],res=pg.res[i],lock=res===true||pg.done,v=pg.vals[i];let ans='';
  const inp=(k,a)=>`<input class="wbin${String(a).length>3?' wide':''}" inputmode="decimal" autocomplete="off" data-r="${i}" data-b="${k}" value="${esc(v[k]||'')}" aria-label="Answer for row ${i+1}"${lock?' disabled':''}>`;
  if(rw.kind=='blank')ans=`<div class="wans">${inp(0,rw.a)}</div>`;
  else if(rw.kind=='eq')ans=`<div class="wans">${rw.parts.map((p,k)=>p.a!=null?inp(k,p.a):`<span>${p.t}</span>`).join('')}</div>`;
  else if(rw.kind=='tap')ans=`<div class="wopts">${rw.opts.map(o=>`<button class="wopt${o.g?' grp':''}${pg.sel[i]==o.v?' on':''}" data-act="wbtap" data-r="${i}" data-v="${esc(o.v)}" aria-pressed="${pg.sel[i]==o.v}"${lock?' disabled':''}>${o.h}</button>`).join('')}</div>`;
  else ans=`<div class="wcol">${rw.items.map((x,k)=>`<button class="wci${pg.col[i].includes(k)?' on':''}" data-act="wbcol" data-r="${i}" data-k="${k}" aria-pressed="${pg.col[i].includes(k)}"${lock?' disabled':''}><span>${x.e}</span></button>`).join('')}</div>`;
  return `<div class="wrow${res===true?' ok':res===false?' no':''}"><span class="wn">${i+1}</span><div>${rw.q?`<div class="wq">${rw.big?`<span class="wbig">${rw.big}</span>`:''}${fx(rw.q)}</div>`:''}${rw.vis?`<div class="wvis">${rw.vis}</div>`:''}${ans}
    ${pg.hint==i?`<ol class="wsteps">${(rw.steps.length?rw.steps:['Read the problem slowly.','Try it one step at a time.']).map(s=>`<li>${fx(s)}</li>`).join('')}</ol>`:''}${res===false&&pg.done?`<p class="muted" style="margin-top:6px">Answer: ${wbAns(rw)}</p>`:''}</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span class="wmark" aria-label="${res===true?'Right':res===false?'Not right yet':''}">${res===true?'✅':res===false?'❌':''}</span>${lock?'':`<button class="whelp" data-act="wbhint" data-r="${i}" aria-label="Show how to solve row ${i+1}">?</button>`}</div></div>`}
V.wbpage=()=>{const pg=S.wbp,n=pg.rows.length,ok=pg.res.filter(x=>x===true).length,need=Math.ceil(n*.75);
  let foot;if(!pg.done)foot=`<div class="row"><button class="btn go" data-act="wbcheck">${pg.checks?'Check again':'Check my page'}</button><button class="btn" data-act="wbprint">Print this page</button></div>${pg.checks?`<div class="fdb bad" role="status">${ok} of ${n} right. Fix the rows with a red mark, then check again.</div>`:''}`;
  else if(pg.pass)foot=`<div class="fdb good" role="status">Page done! ${pg.first} of ${n} right on the first check${pg.first?`, so you earned ${pg.first} star${pg.first==1?'':'s'}`:''}.</div><div class="row">${pg.p<149?`<button class="btn go" data-act="wbgo" data-p="${pg.p+1}">Next page</button>`:''}<button class="btn" data-act="go" data-s="wbook">All pages</button></div>`;
  else foot=`<div class="fdb bad" role="status">${ok} of ${n} right. You need ${need} to finish this page. The answers are shown, so look at them, then try a new copy with new numbers.</div><div class="row"><button class="btn go" data-act="wbgo" data-p="${pg.p}">Try a new copy</button><button class="btn" data-act="go" data-s="wbook">All pages</button></div>`;
  return bar(`${wbTitle(pg.g)} · Page ${pg.p+1}`,'wbook')+`<main class="wrap"><div class="wsheet"><div class="whead"><span><span class="pill">Unit ${pg.u+1} · Page ${pg.p+1} of 150</span></span><h2>${pg.unit}</h2><p>${pg.ins}</p></div>${pg.rows.map((_,i)=>wbRowHTML(pg,i)).join('')}</div>${foot}</main>`};
function wbPrintHTML(pg){const k=K(),blank=a=>`<span class="pl" style="min-width:${Math.max(54,String(a).length*16)}px"></span>`;
  const row=(rw,i)=>{let a='';if(rw.kind=='blank')a=blank(rw.a);else if(rw.kind=='eq')a=rw.parts.map(p=>p.a!=null?blank(p.a):` ${p.t} `).join('');else if(rw.kind=='tap')a='Circle one: '+rw.opts.map(o=>`<span class="pbox">${o.h}</span>`).join('');else a=rw.items.map(x=>`<span class="wci" style="display:inline-grid;place-items:center"><span>${x.e}</span></span>`).join(' ');
    return `<tr><td class="pn">${i+1}</td><td>${rw.q?`<div style="font-weight:700;margin-bottom:4px">${rw.big?`<b style="font-size:16pt;margin-right:6px">${rw.big}</b>`:''}${fx(rw.q)}</div>`:''}${rw.vis?`<div class="wvis">${rw.vis}</div>`:''}<div style="font-size:14pt">${a}</div></td></tr>`};
  return `<div class="pw"><h1>${wbTitle(pg.g)}</h1><div class="pmeta"><span>Unit ${pg.u+1}: ${pg.unit} · Page ${pg.p+1} of 150</span><span>Name: ______________</span></div><p class="pins">${pg.ins}</p><table>${pg.rows.map(row).join('')}</table>
    <div class="pkey"><h1>Answer key</h1><div class="pmeta"><span>${wbTitle(pg.g)} · Page ${pg.p+1}</span><span>For grown-ups</span></div><ol>${pg.rows.map(rw=>`<li>${wbAns(rw)}</li>`).join('')}</ol></div></div>`}
function wbFinish(){const pg=S.wbp,k=K(),n=pg.rows.length,ok=pg.res.filter(x=>x===true).length,b=wbBook(k,pg.g);pg.done=1;pg.pass=ok>=Math.ceil(n*.75);touchDay(k);
  if(pg.pass){if(pg.p==b.done&&b.done<150)b.done++;b.sc[pg.p]=Math.max(b.sc[pg.p]||0,pg.first);k.c.wbp=(k.c.wbp||0)+1;k.stars+=pg.first;k.c.correct+=pg.first;snd('win');confetti(80);digitSay(ok==n?'Every row is right. '+yay():'Page done! '+yay())}
  else{snd('no');digitSay('Good effort. Look at the answers, then try a new copy of this page.')}
  save();render();checkBadges()}

function render(){$('app').innerHTML=V[S.scr]();$('digit').style.display=K()&&S.scr!='who'?'':'none'}
function go(s,x){clearInterval(S.tick);voice.stop();$('dbub').hidden=true;if(s=='home')S.say=SAYS[Math.floor(Math.random()*SAYS.length)];Object.assign(S,x||{});S.scr=s;S.entry='';S.wi=0;S.rv=null;render();scrollTo(0,0)}

/* ---------- practice & tests ---------- */
function freshP(tid,not){let p;for(let i=0;i<5;i++){p=mk(tid,RNG(seed()));if(p.q!=not)break}return p}
function rec(k,p,ok){const s=tstat(k,p.tid);s.n++;if(ok){s.c++;k.c.correct++;k.stars++;k.run++;k.c.bestRun=Math.max(k.c.bestRun,k.run);if(p.word)k.c.words++}else k.run=0}
function miss(k,p){if(!k.missed.some(m=>m.q==p.q)){k.missed.unshift({tid:p.tid,q:p.q,a:p.a});k.missed.length=Math.min(k.missed.length,40)}}
const CHEER=['Yes! You got it.','Correct. Nice thinking.','That is right!','You solved it.'];
function practiceAnswer(v){const s=S.pr,p=s.p,k=K();if(s.done)return;touchDay(k);const ok=isRight(p,v);
  if(ok){if(!s.tries)rec(k,p,true);else{k.stars++}s.done=s.ok=true;s.msg=CHEER[Math.floor(Math.random()*4)]+(s.tries?' Sticking with it paid off.':'');
    if(s.fix!=null){k.missed.splice(s.fix,1);k.c.fixed++}}
  else if(!s.tries){rec(k,p,false);s.tries=1;s.msg='Not yet. Try again, or tap "Show me a way" for help.'}
  else{s.done=true;s.ok=false;s.msg=`The answer is ${fx(SIGN[p.a]||p.a)}. Look at the ways below to see how.`;if(s.fix==null)miss(k,p)}
  S.entry='';save();render();if(ok){snd('ok');confetti(28);digitSay(yay())}else{snd('no');digitSay(s.done?`That one was tricky. The answer is ${p.a}. Let us look at a way to solve it together.`:'Not yet. Try again. You can do it!')}checkBadges()}
function pickSeed(cfg,old){let best=seed(),bo=1e9;if(!old)return best;const os=new Set(genTest({...cfg,seed:old.seed},10).map(p=>p.q));
  for(let i=0;i<8;i++){const sd=seed(),o=genTest({...cfg,seed:sd},10).filter(p=>os.has(p.q)).length;if(o<bo){bo=o;best=sd}if(!o)break}return best}
function startTest(tid,kind,old,pool,setIdx){const k=K(),g=T[tid]?T[tid].g:(old?old.g:k.g),cfg={tid,kind,g,retakeOf:old?old.id:null};if(pool||old&&old.pool){cfg.pool=pool||old.pool;cfg.set=setIdx!=null?setIdx:old.set}cfg.seed=pickSeed(cfg,old);
  const n=kind=='timed'?70:10;S.ts={cfg,n,probs:genTest(cfg,n),i:0,ans:[],t0:Date.now()};go('test');
  if(kind=='timed'){const end=Date.now()+90000;S.tick=setInterval(()=>{const left=Math.max(0,Math.ceil((end-Date.now())/1000)),c=$('clock');if(c)c.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(!left)finishTest()},250)}}
function testAnswer(v){const s=S.ts;snd('tap');s.ans.push(v);s.i++;S.entry='';if(s.i>=s.probs.length||(s.cfg.kind!='timed'&&s.i>=s.n))finishTest();else render()}
function finishTest(){clearInterval(S.tick);const s=S.ts,k=K(),tm=s.cfg.kind=='timed';touchDay(k);const ok=s.ans.map((v,i)=>isRight(s.probs[i],v)?1:0),score=ok.reduce((a,b)=>a+b,0);let m=0;
  s.ans.forEach((v,i)=>{rec(k,s.probs[i],!!ok[i]);if(!ok[i]&&m++<5)miss(k,s.probs[i])});
  const e={id:'t'+Date.now().toString(36),ts:Date.now(),kind:s.cfg.kind,tid:s.cfg.tid,g:s.cfg.g,seed:s.cfg.seed,ans:s.ans,ok,score,total:tm?s.ans.length:s.n,retakeOf:s.cfg.retakeOf};if(s.cfg.pool){e.pool=s.cfg.pool;e.set=s.cfg.set}
  let old=null;if(e.retakeOf){const o=k.tests.find(t=>t.id==e.retakeOf);if(o){old=o.score;if(score>o.score)k.c.comeback++}}
  if(tm)k.c.bestSprint=Math.max(k.c.bestSprint,score);else{if(score==10)k.c.perfect++;if(T[e.tid]){const st=tstat(k,e.tid);st.best=Math.max(st.best||0,score)}}
  k.tests.unshift(e);k.tests.length=Math.min(k.tests.length,30);
  if(e.tid=='set'&&e.set===k.path.set&&k.path.lesson>=20&&score>=8){const P=k.path,gm=nextGame(k);P.done++;P.set++;P.lesson=0;P.guided=0;const ng=setInfo(k).g;if(ng>k.g)k.g=ng;k.stars+=20;save();S.res={e,probs:s.probs,fresh:true,old};go('path');celebrate(gm);return}
  save();S.res={e,probs:s.probs,fresh:true,old};go('result');checkBadges()}

/* ---------- games ---------- */
function gp(r){const k=K();for(let i=0;i<20;i++){const p=mk(pick(r,FAST[k.g]),r);if(p.type=='num')return p}return mk('add20',r)}
function frogCfg(g){const tk=(a,b,st,lab)=>{const o=[];for(let v=a;v<=b+1e-9;v+=st)o.push({v,l:lab(v)});return o};
  if(g==1)return{min:0,max:20,tol:.5,snap:1,ticks:tk(0,20,1,v=>v%5?null:v),t:r=>{const v=ri(r,1,19);return[v,String(v)]}};
  if(g==2)return{min:0,max:100,tol:3,ticks:tk(0,100,10,v=>v),t:r=>{const v=ri(r,3,97);return[v,String(v)]}};
  if(g==3)return{min:0,max:1000,tol:30,ticks:tk(0,1000,100,v=>v%200?null:v),t:r=>{const v=ri(r,3,97)*10;return[v,String(v)]}};
  if(g==4)return{min:0,max:1,tol:.06,ticks:[{v:0,l:'0'},{v:.5,l:'half'},{v:1,l:'1'}],t:r=>{const d=pick(r,[3,4,5,6,8,10]),n=ri(r,1,d-1);return[n/d,`${n}/${d}`]}};
  return{min:0,max:2,tol:.07,ticks:tk(0,2,.5,v=>fmt(v)),t:r=>{const v=ri(r,5,195)/100;return[v,fmt(v)]}}}
function frogRound(g){const[t,l]=g.cfg.t(g.r);g.target=t;g.label=l;g.guess=null}
function makeRound(g){const k=Math.min(K().g,5),r=g.r,u=[1,5,5,25,.25][k-1],lo=[1,1,2,1,1][k-1],hi=[9,8,30,20,20][k-1],set=new Set();while(set.size<6)set.add(ri(r,lo,hi)*u);g.tiles=shuf(r,[...set]);
  const ix=shuf(r,[0,1,2,3,4,5]).slice(0,ri(r,2,3));g.target=ix.reduce((a,i)=>a+g.tiles[i],0);g.on=[];g.msg=''}
function popRound(g){g.p=gp(g.r);g.ch=distract(g.r,g.p.a);g.wrong=[]}
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],G=()=>K().g;
const near=(r,v,n)=>{const s=new Set();let q=0;while(s.size<n&&q++<80){const x=v+pick(r,[1,-1,2,-2,3,10,-10,5,-5]);if(x>=0&&x!=v)s.add(x)}let j=11;while(s.size<n)s.add(v+j++);return[...s]};
function tfRound(g){g.e=expr(g.r,G());g.truth=g.r()<.5;g.shown=g.truth?g.e.v:near(g.r,g.e.v,1)[0]}
function sortRound(g){const r=g.r,gr=G(),set=new Map();let q=0;
  while(set.size<5&&q++<200){let s,v;if(gr<=3){v=ri(r,0,gr==1?20:gr==2?100:999);s=String(v)}else if(gr==4){const d=pick(r,[2,3,4,5,6,8]),n=ri(r,1,d-1);v=n/d;s=n+'/'+d}else if(gr==5){v=ri(r,1,999)/100;s=fmt(v)}else{v=ri(r,-20,20);s=String(v)}
    if(![...set.values()].some(c=>Math.abs(c.v-v)<1e-9))set.set(s,{s,v})}
  g.cards=[...set.values()];g.order=g.cards.map((c,i)=>i).sort((a,b)=>g.cards[a].v-g.cards[b].v);g.done=[]}
function signRound(g){const r=g.r,gr=G();g.ops=gr<=2?['+','−']:['+','−','×','÷'];for(let q=0;q<60;q++){const op=pick(r,g.ops);let a,b;const m=gr<=1?10:gr==2?50:99;
    if(op=='+'){a=ri(r,1,m);b=ri(r,1,m)}else if(op=='−'){a=ri(r,2,m);b=ri(r,1,a-1)}else if(op=='×'){a=ri(r,2,gr<=3?10:12);b=ri(r,2,10)}else{b=ri(r,2,10);a=b*ri(r,2,10)}
    const all={'+':a+b,'−':a-b,'×':a*b,'÷':a/b},c=all[op];if(Object.values(all).filter(x=>x==c).length==1){g.a=a;g.b=b;g.c=c;g.op=op;return}}}
function trainRound(g){const r=g.r,gr=G();let st,s0,mul=0;
  if(gr==1){st=pick(r,[1,2,5,10]);s0=st*ri(r,0,6)}else if(gr==2){st=pick(r,[2,3,4,5,10,-2,-5]);s0=st<0?ri(r,30,60):st*ri(r,1,9)}else if(gr==3){if(r()<.3){mul=2;s0=ri(r,1,6)}else{st=ri(r,3,12);s0=ri(r,0,30)}}
  else if(gr==4){st=pick(r,[25,50,11,15,20,100,-25]);s0=st<0?ri(r,8,12)*25:ri(r,0,9)*st}else if(gr==5){st=pick(r,[.5,.25,1.5,.1,.2]);s0=ri(r,0,8)}else{if(r()<.3){mul=3;s0=ri(r,1,4)}else{st=pick(r,[-3,-4,-5,-7,-6]);s0=ri(r,5,15)}}
  g.seq=[s0];for(let i=1;i<5;i++)g.seq.push(mul?g.seq[i-1]*mul:Math.round((g.seq[i-1]+st)*100)/100);g.bi=ri(r,2,4);const a=g.seq[g.bi],d=mul?g.seq[g.bi-1]:Math.abs(st),set=new Set([fmt(a)]);[a+d,a-d,a+2*d,a-2*d,a+1,a+10].forEach(x=>{if(set.size<4)set.add(fmt(x))});g.ch=shuf(r,[...set]);g.rule=mul?'times '+mul:(st>0?'add ':'subtract ')+fmt(Math.abs(st))}
function clashRound(g){let q=0;do{g.L=expr(g.r,G());g.R=expr(g.r,G())}while(g.L.v==g.R.v&&q++<40)}
function moleTick(g){const r=g.r,ix=shuf(r,[0,1,2,3,4,5,6,7,8]).slice(0,3),w=near(r,g.e.v,3);g.holes=Array(9).fill(null);ix.forEach((h,j)=>{g.holes[h]=w[j]});if(r()<.7)g.holes[ix[0]]=g.e.v}
function tttAI(g){const b=g.b,find=m=>{for(const L of LINES){const c=L.map(i=>b[i]);if(c.filter(x=>x==m).length==2&&c.includes(''))return L[c.indexOf('')]}return -1};let i=find('O');if(i<0)i=find('X');if(i<0&&!b[4])i=4;if(i<0){const e=b.map((c,j)=>c?-1:j).filter(j=>j>=0);i=e[Math.floor(g.r()*e.length)]}if(i>=0)b[i]='O'}
const won=(b,m)=>LINES.some(L=>L.every(i=>b[i]==m));
function startGame(id){const k0=K(),gi=GAMES.findIndex(x=>x.id==id);if(gi>=unl(k0)&&!k0.games[id]?.wins)return;if(id=='color'&&k0.sg!==0)return;const r=RNG(seed()),g={id,r};
  if(id=='color'){g.pi=((k0.games.color&&k0.games.color.wins)||0)%CBN_PICS.length;g.fill=[];g.sel=0}
  if(id=='pop'){g.round=0;g.lives=3;g.score=0;popRound(g)}
  if(id=='mem'){const ps=[],as=new Set();let n=0;while(ps.length<6&&n++<200){const p=gp(r);if(!as.has(p.a)&&!ps.some(x=>x.q==p.q)){as.add(p.a);ps.push(p)}}
    g.cards=shuf(r,ps.flatMap((p,i)=>[{t:p.q.replace(' = ?','').replace('What is the top number?','').replace('What is the missing top number?','').replace('How many in all?','').trim(),k:i},{t:p.a,k:i}]));g.moves=0;g.sel=[]}
  if(id=='frog'){g.cfg=frogCfg(K().g);g.round=0;g.hits=0;frogRound(g)}
  if(id=='make'){g.round=0;g.solved=0;makeRound(g)}
  if(id=='tf'){g.round=0;g.score=0;tfRound(g)}
  if(id=='sort'){g.round=0;g.slips=0;sortRound(g)}
  if(id=='stones'){g.at=0;g.lives=3;g.sunk=[];g.rows=[0,1,2,3,4].map(()=>{const e=expr(r,G());return{e,opts:shuf(r,[e.v,...near(r,e.v,2)])}})}
  if(id=='bingo'){const es=[];let q=0;while(es.length<9&&q++<400){const e=expr(r,G());if(!es.some(x=>x.v==e.v))es.push(e)}while(es.length<9)es.push({t:`${es.length} + 100`,v:es.length+100});g.cells=shuf(r,es.map(e=>e.v));g.calls=shuf(r,es);g.ci=0;g.marked=[];g.strikes=0}
  if(id=='mole'){g.score=0;g.e=expr(r,G());g.end=Date.now()+50000;moleTick(g)}
  if(id=='sign'){g.round=0;g.score=0;signRound(g)}
  if(id=='train'){g.round=0;g.score=0;trainRound(g)}
  if(id=='clash'){g.round=0;g.score=0;clashRound(g)}
  if(id=='ttt'){g.b=Array(9).fill('');g.ask=null}
  if(id=='space'){g.ships=[];g.score=0;g.lives=3;g.n=0;g.next=.6}
  if(id=='race'){g.me=0;g.zog=0;g.right=0;raceRound(g)}
  S.gm=g;go('game');
  if(id=='mole')S.tick=setInterval(()=>{if(S.gm!==g||g.over)return clearInterval(S.tick);if(Date.now()>=g.end)return endGame(g.score>=8,`You whacked ${g.score} moles. ${g.score>=8?'':'Whack 8 to win.'}`);moleTick(g);render()},1500);
  if(id=='space'){spaceLoop(g);digitSay('Alien ships incoming! Solve a ship to zap it.')}
  if(id=='race'){digitSay('Ready, set, blast off!');S.tick=setInterval(()=>{if(S.gm!==g||g.over)return clearInterval(S.tick);g.zog+=100/85*.2;const z=$('zog');if(z)z.style.left=Math.min(100,g.zog)*.8+'%';if(g.zog>=100)endGame(false,`Zog reached the moon first. You got ${g.right} right.`)},200)}}

  key:d=>{let e=S.entry;if(d.k=='±')e=e[0]=='-'?e.slice(1):'-'+e;else if(d.k=='⌫')e=e.slice(0,-1);else if(d.k=='.'){if(!e.includes('.'))e=(e||'0')+'.'}else if(e.length<7)e+=d.k;S.entry=e;const b=$('ansbox');if(b)b.innerHTML=e?esc(e):'<span class="ph">?</span>'},
  ans:d=>{const v=d.v=='@'?S.entry:d.v;if(d.v=='@'&&(v===''||v==='.'||v==='0.'&&false)){toast('Tap the numbers to type your answer first.');return}(({test:testAnswer,stack:stackAnswer,page:storyAnswer,guide:guideAnswer,game:spaceZap,dl:dlAnswer})[S.scr]||practiceAnswer)(v)},
  skip:()=>testAnswer(''),
  test:d=>startTest(d.tid,d.kind),
  look:d=>{const e=K().tests.find(t=>t.id==d.id);if(!e)return;const cfg={tid:e.tid,kind:e.kind,g:e.g,seed:e.seed,pool:e.pool};S.res={e,probs:genTest(cfg,Math.max(10,e.ans.length))};go('result')},
  retake:d=>{const e=K().tests.find(t=>t.id==d.id);if(e)startTest(e.tid,e.kind,e)},
  rv:d=>{S.rv=S.rv==+d.i?null:+d.i;S.wi=0;render()},
  fixit:d=>{const m=K().missed[+d.i];if(!m||!T[m.tid])return;S.pr={p:freshP(m.tid,m.q),tries:0,fix:+d.i};go('practice',{tid:m.tid})},
  closebadge:()=>{$('over').classList.remove('on');showBadge()},
  game:d=>startGame(d.id),
  pop:d=>{const g=S.gm;snd(d.v===g.p.a?'pop':'no');if(d.v===g.p.a){g.score++;g.round++;if(g.round>=10)return endGame(true,`You popped all 10 with ${g.lives} ${g.lives==1?'life':'lives'} left.`);popRound(g)}else{g.wrong.push(d.v);g.lives--;if(g.lives<=0)return endGame(false,`You popped ${g.score} balloons. The last answer was ${g.p.a}.`)}render()},
  flip:d=>{const g=S.gm,i=+d.i,c=g.cards[i];if(g.lock||c.open||c.done)return;c.open=true;g.sel.push(i);
    if(g.sel.length==2){g.moves++;const[a,b]=g.sel.map(j=>g.cards[j]);g.sel=[];if(a.k==b.k){snd('ok');a.done=b.done=true;a.open=b.open=false;if(g.cards.every(x=>x.done)){render();return endGame(true,`You matched all 6 pairs in ${g.moves} moves.`)}}else{g.lock=true;setTimeout(()=>{a.open=b.open=false;g.lock=false;if(S.gm==g&&S.scr=='game')render()},1100)}}render()},
  frogtap:(d,el,ev)=>{const g=S.gm;if(g.guess!=null)return;const b=el.getBoundingClientRect(),c=g.cfg;let v=c.min+Math.max(0,Math.min(1,(ev.clientX-b.left)/b.width))*(c.max-c.min);if(c.snap)v=Math.round(v);g.guess=v;g.hit=Math.abs(v-g.target)<=c.tol;if(g.hit)g.hits++;snd(g.hit?'ok':'no');render()},
  frognext:()=>{const g=S.gm;g.round++;if(g.round>=8)return endGame(g.hits>=6,`You landed ${g.hits} of 8 hops. ${g.hits>=6?'':'Land 6 to win.'}`);frogRound(g);render()},
  tile:d=>{const g=S.gm,i=+d.i;if(g.msg)return;g.on=g.on.includes(i)?g.on.filter(x=>x!=i):[...g.on,i];const sum=g.on.reduce((a,j)=>a+g.tiles[j],0);
    snd('tap');if(Math.abs(sum-g.target)<1e-9){snd('ok');g.solved++;g.msg=`${g.on.map(j=>fmt(g.tiles[j])).join(' + ')} = ${fmt(g.target)}. You made it!`;render();setTimeout(()=>{if(S.gm==g&&S.scr=='game')A.mkskip(1)},1300);return}render()},
  mkskip:()=>{const g=S.gm;g.round++;if(g.round>=6)return endGame(g.solved>=5,`You made ${g.solved} of 6 targets. ${g.solved>=5?'':'Make 5 to win.'}`);makeRound(g);render()},
  gvoice:d=>{const k=S.kids.find(x=>x.id==d.id);k.voice=d.v;store.save(k);render();if(d.v!='off'){const was=S.kid,on=voice.on;S.kid=k.id;voice.on=true;voice.say(`Hi ${k.name}! I am Digit. Great job today.`);S.kid=was;voice.on=on}},
  gg:d=>{const k=S.kids.find(x=>x.id==d.id),n=Math.max(0,Math.min(5,k.sg+ +d.v));if(n==k.sg)return;k.sg=n;k.g=n;const P=k.path;P.base=n;P.from=P.set;P.lesson=0;P.guided=0;store.save(k);render()},
  rmcode:d=>{const k=S.kids.find(x=>x.id==d.id);k.code=null;store.save(k);render();toast('Picture code removed.')},
  del:d=>{S.delq=d.id;render()},delno:()=>{S.delq=null;render()},
  delyes:d=>{const k=S.kids.find(x=>x.id==d.id);S.kids=S.kids.filter(x=>x.id!=d.id);store.del(k);S.delq=null;if(!S.kids.length)go('who');else render()},
};
/* ===== Background music: a gentle synthesized loop (no audio files needed) ===== */
const MUS={on:false,want:false,timer:null,bus:null,t:0,pos:0};
const MUS_BPM=96;
const MUS_F={A2:110,C3:130.81,F2:87.31,G2:98,A3:220,G3:196,C4:261.63,E4:329.63,G4:392,D4:293.66,F4:349.23,A4:440,C5:523.25,D5:587.33,E5:659.25,G5:783.99,F3:174.61};
// 8 bars of 4 beats. Each entry is [note, beats]; the total is 32 beats, then the loop repeats.
const MUS_MEL=[['E5',1],['G5',1],['C5',1],['E5',1], ['A4',1],['C5',1],['E5',1],['C5',1], ['F4',1],['A4',1],['C5',1],['A4',1], ['G4',1],['D5',1],['G4',1],['D5',1], ['C5',1],['D5',1],['E5',2], ['E5',1],['C5',1],['A4',2], ['A4',1],['C5',1],['F4',2], ['G4',1],['D4',1],['E4',2]];
const MUS_CHORD=[['C4','E4','G4'],['A3','C4','E4'],['F3','A3','C4'],['G3','D4'],['C4','E4','G4'],['A3','C4','E4'],['F3','A3','C4'],['G3','D4']];
const MUS_BASS=['C3','A2','F2','G2','C3','A2','F2','G2'];
const MUS_STARTS=(()=>{const s=new Array(32).fill(null);let b=0;MUS_MEL.forEach(([n,d])=>{s[b]={f:MUS_F[n],d};b+=d});return s})();
const musBeat=()=>60/MUS_BPM;
function musTone(f,t,dur,type,vol){const C=snd.c;const o=C.createOscillator(),g=C.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(MUS.bus);o.start(t);o.stop(t+dur+0.05)}
function musPlayBeat(pos,t){const b=musBeat(),bar=Math.floor(pos/4),inBar=pos%4;
  if(inBar==0)(MUS_CHORD[bar]||[]).forEach(n=>musTone(MUS_F[n],t,b*3.8,'triangle',0.02));
  if(inBar==0||inBar==2)musTone(MUS_F[MUS_BASS[bar]]*(inBar==2?1.5:1),t,b*1.7,'sine',0.09);
  const m=MUS_STARTS[pos];if(m)musTone(m.f,t,b*m.d*0.9,'sine',0.07)}
function musPump(){const C=snd.c;if(!MUS.on||!C)return;while(MUS.t<C.currentTime+0.15){musPlayBeat(MUS.pos,MUS.t);MUS.t+=musBeat();MUS.pos=(MUS.pos+1)%32}MUS.timer=setTimeout(musPump,40)}
function musStart(){MUS.want=true;if(MUS.on||S.mute||!(window.AudioContext||window.webkitAudioContext))return;const C=snd.c||(snd.c=new(window.AudioContext||window.webkitAudioContext)());if(C.state=='suspended')C.resume();if(!MUS.bus){MUS.bus=C.createGain();MUS.bus.gain.value=0.7;MUS.bus.connect(C.destination)}MUS.on=true;MUS.t=C.currentTime+0.1;MUS.pos=0;musPump()}
function musStop(){MUS.on=false;clearTimeout(MUS.timer);MUS.timer=null}
function musSync(){if(S.mute)musStop();else if(MUS.want)musStart()}
document.addEventListener('pointerdown',()=>musStart());
document.addEventListener('visibilitychange',()=>{if(document.hidden)musStop();else musSync()});
Object.assign(A,{
  wbopen:d=>go('wbook',{wbg:+d.g}),
  wbgo:d=>{const k=K(),g=S.wbg,p=+d.p,b=wbBook(k,g);if(p>b.done||p>149)return;S.wbp=wbPage(g,p,seed());go('wbpage')},
  wbtap:d=>{const pg=S.wbp,i=+d.r;if(pg.done||pg.res[i]===true)return;pg.sel[i]=d.v;snd('tap');if(pg.res[i]===false)pg.res[i]=null;render()},
  wbcol:d=>{const pg=S.wbp,i=+d.r,kk=+d.k,c=pg.col[i];if(pg.done||pg.res[i]===true)return;const at=c.indexOf(kk);if(at>=0)c.splice(at,1);else c.push(kk);snd('tap');if(pg.res[i]===false)pg.res[i]=null;render()},
  wbhint:d=>{const pg=S.wbp,i=+d.r;pg.hint=pg.hint==i?-1:i;render()},
  wbcheck:()=>{const pg=S.wbp,n=pg.rows.length;
    const empty=pg.rows.findIndex((rw,i)=>pg.res[i]!==true&&(rw.kind=='tap'?pg.sel[i]==null:rw.kind=='color'?!pg.col[i].length:pg.vals[i].some((v,kk)=>(rw.kind=='blank'||rw.parts[kk].a!=null)&&String(v).trim()=='')));
    if(empty>=0&&!pg.checks){toast(`Row ${empty+1} is not finished yet.`);return}
    pg.res=pg.rows.map((_,i)=>wbRowOk(pg,i));pg.checks++;const ok=pg.res.filter(Boolean).length;if(pg.checks==1)pg.first=ok;pg.hint=-1;
    if(ok==n||pg.checks>=2)return wbFinish();snd('no');digitSay(`${ok} right so far. Tap the question mark on a red row if you want help.`);render()},
  wbprint:()=>{const pa=$('printarea');if(!pa)return;pa.innerHTML=wbPrintHTML(S.wbp);try{window.print()}catch(e){toast('Printing is not available here. Open the app in a browser to print.')}},
});
document.addEventListener('input',ev=>{const t=ev.target;if(t.classList&&t.classList.contains('wbin')&&S.wbp){const i=+t.dataset.r,kk=+t.dataset.b;S.wbp.vals[i][kk]=t.value;if(S.wbp.res[i]===false){S.wbp.res[i]=null;const rw=t.closest('.wrow');if(rw)rw.classList.remove('no')}}});
document.addEventListener('keydown',ev=>{const t=ev.target;if(ev.key=='Enter'&&t.classList&&t.classList.contains('wbin')){ev.preventDefault();const all=[...document.querySelectorAll('input.wbin:not([disabled])')],i=all.indexOf(t);if(i>=0&&i<all.length-1)all[i+1].focus();else A.wbcheck()}});
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el||el.disabled)return;const f=A[el.dataset.act];if(f)f(el.dataset,el,ev)});
document.addEventListener('input',ev=>{if(ev.target.id=='nm'&&S.form)S.form.name=ev.target.value});
document.addEventListener('keydown',ev=>{if(ev.target.tagName=='INPUT'||$('over').classList.contains('on'))return;
  const sk=S.scr=='stack'&&!S.sk.done&&!S.sk.steps[S.sk.i].auto,gq=S.scr=='guide'&&!S.gd.ok&&S.gd.steps[S.gd.i].q,sp=S.scr=='game'&&S.gm.id=='space'&&!S.gm.over,p=sk||gq||sp?{type:'num'}:S.scr=='dl'&&S.dl.stage=='work'&&!S.dl.pd?S.dl.probs[S.dl.i]:S.scr=='page'&&!S.st.done?S.st.p:S.scr=='practice'&&!S.pr.done?S.pr.p:S.scr=='test'?S.ts.probs[S.ts.i]:null;if(!p||p.type!='num')return;
  if(/^[0-9.]$/.test(ev.key))A.key({k:ev.key});else if(ev.key=='-'&&p.neg)A.key({k:'±'});else if(ev.key=='Backspace')A.key({k:'⌫'});else if(ev.key=='Enter'&&!ev.target.closest('button')){ev.preventDefault();A.ans({v:'@'})}});
render();
store.init().then(res=>{if(res==='recover'){S.kids=[];go('setpw')}else if(res===null){S.kids=[];go('signin')}else{S.kids=res;go('who')}});
window.addEventListener('sbrecovery',()=>{if(S.scr!='setpw'){S.authErr='';go('setpw')}});
</script>
